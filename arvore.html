<script type="text/babel" data-presets="react">
// components/HistoryModal.js — "Ver histórico completo": evolução
// diária/semanal/mensal, estatísticas e comparações WoW/MoM, com seletor
// de período (7/30/90/personalizado).
(function () {
  const { useState, useMemo, useRef, useEffect } = React;

  const PERIODS = [
    { key: "7", label: "7 dias", days: 7 },
    { key: "30", label: "30 dias", days: 30 },
    { key: "90", label: "90 dias", days: 90 },
    { key: "custom", label: "Personalizado", days: null },
  ];

  function StatCard({ label, value, sub, tone }) {
    return (
      <div className="rounded-lg border border-neutral-200 bg-white px-3.5 py-3">
        <div className="text-[11px] text-neutral-500 mb-1">{label}</div>
        <div className={"text-lg font-bold " + (tone || "text-neutral-800")}>{value}</div>
        {sub && <div className="text-[11px] text-neutral-400 mt-0.5">{sub}</div>}
      </div>
    );
  }

  function HistoryLineChart({ labels, values, targetValue, unit, kpi, height = 260 }) {
    const canvasRef = useRef(null);
    const chartRef = useRef(null);
    useEffect(() => {
      if (!canvasRef.current) return;
      const ctx = canvasRef.current.getContext("2d");
      if (chartRef.current) chartRef.current.destroy();
      chartRef.current = new Chart(ctx, {
        type: "line",
        data: {
          labels,
          datasets: [
            targetValue !== null && targetValue !== undefined && {
              label: "Target",
              data: values.map(() => targetValue),
              borderColor: "#C8401F",
              borderDash: [5, 4],
              borderWidth: 1.2,
              pointRadius: 0,
              fill: false,
            },
            {
              label: "Resultado",
              data: values,
              borderColor: "#EE4D2D",
              backgroundColor: "rgba(238,77,45,.08)",
              borderWidth: 2,
              pointRadius: values.length > 45 ? 0 : 2.5,
              pointHoverRadius: 6,
              fill: true,
              tension: 0.25,
              spanGaps: true,
            },
          ].filter(Boolean),
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          interaction: { mode: "index", intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: "#242424",
              padding: 8,
              callbacks: {
                label: (item) => {
                  if (item.raw === null || item.raw === undefined) return "Sem dado";
                  const label = item.dataset.label === "Target" ? "Target: " : "Resultado: ";
                  return label + item.raw.toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + (unit === "percent" ? "%" : "");
                },
              },
            },
            datalabels: {
              display: (ctx) => {
                if (!kpi || !ChartHelpers.labelsFitDensity(labels.length, 1)) return false;
                if (ctx.dataset.label === "Target") return false;
                return ctx.dataset.data[ctx.dataIndex] !== null && ctx.dataset.data[ctx.dataIndex] !== undefined;
              },
              align: (ctx) => ChartHelpers.labelAlign(ctx.dataset.data, ctx.dataIndex),
              anchor: "center",
              offset: 6,
              clamp: true,
              color: "#3a3a3a",
              font: { size: 9, weight: "600" },
              backgroundColor: "rgba(255,255,255,.88)",
              borderRadius: 3,
              padding: { top: 1, bottom: 1, left: 3, right: 3 },
              formatter: (v) => {
                if (v === null || v === undefined || !kpi) return "";
                const raw = unit === "percent" ? v / 100 : v;
                return Fmt.formatKpiValue(kpi, raw);
              },
            },
          },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 10 }, color: "#8a8a8a", maxRotation: 0, autoSkip: true, maxTicksLimit: 12 } },
            y: { grid: { color: "#F0F0F0" }, ticks: { font: { size: 10 }, color: "#8a8a8a", callback: (v) => v + (unit === "percent" ? "%" : "") } },
          },
        },
      });
      return () => { if (chartRef.current) chartRef.current.destroy(); };
    }, [JSON.stringify(labels), JSON.stringify(values), targetValue, kpi && kpi.id]);

    return <div style={{ height }}><canvas ref={canvasRef}></canvas></div>;
  }

  function HistoryModal({ kpi, selectedIso, onClose }) {
    const [period, setPeriod] = useState("30");
    const [granularity, setGranularity] = useState("daily"); // daily | weekly | monthly
    const bounds = DataService.getDateBounds();
    const lastReal = DataService.getMeta().lastRealDate;
    const endIso = selectedIso <= lastReal ? selectedIso : lastReal;
    const [customFrom, setCustomFrom] = useState(Calc.addDaysIso(endIso, -30));
    const [customTo, setCustomTo] = useState(endIso);

    useEffect(() => {
      function onEsc(e) { if (e.key === "Escape") onClose(); }
      document.addEventListener("keydown", onEsc);
      return () => document.removeEventListener("keydown", onEsc);
    }, []);

    const range = useMemo(() => {
      const p = PERIODS.find((x) => x.key === period);
      if (period === "custom") return { from: customFrom, to: customTo };
      const from = Calc.addDaysIso(endIso, -(p.days - 1));
      return { from: from < bounds.min ? bounds.min : from, to: endIso };
    }, [period, customFrom, customTo, endIso]);

    const days = DataService.getDays().filter((d) => d.iso >= range.from && d.iso <= range.to);
    const dailySeries = Calc.getDailySeries(kpi, days);
    const weeks = DataService.getWeeks().filter((w) => w.endIso >= range.from && w.startIso <= range.to);
    const weeklySeries = Calc.getWeeklySeries(kpi, weeks);
    const monthlySeries = Calc.getMonthlySeries(kpi, days);

    const activeSeries = granularity === "daily" ? dailySeries : granularity === "weekly" ? weeklySeries : monthlySeries;
    const labels = activeSeries.map((p) => p.label);
    const values = activeSeries.map((p) => (p.value === null ? null : kpi.unit === "percent" ? p.value * 100 : p.value));
    const targetChart = kpi.target !== null ? (kpi.unit === "percent" ? kpi.target * 100 : kpi.target) : null;

    const st = Calc.stats(dailySeries.map((p) => p.value));
    const allWeeks = DataService.getWeeks().filter((w) => w.hasRealData || w.endIso <= lastReal);
    const wow = Calc.lastTwoDelta(Calc.getWeeklySeries(kpi, allWeeks.filter((w) => w.endIso <= range.to)));
    const allMonths = Calc.getMonthlySeries(kpi, DataService.getDays().filter((d) => d.iso <= range.to));
    const mom = Calc.lastTwoDelta(allMonths);

    function deltaLabel(d) {
      if (!d) return "Sem dado suficiente";
      const improved = Calc.isImprovement(kpi, d.delta);
      const arrow = improved === true ? "↑ melhora" : improved === false ? "↓ piora" : "→ estável";
      return Fmt.formatDelta(kpi, d.delta) + " (" + arrow + ")";
    }

    return (
      <div className="fixed inset-0 z-[70] flex items-center justify-center p-4">
        <div className="absolute inset-0 bg-black/40 overlay-fade" onClick={onClose} />
        <div className="anim-pop relative bg-white rounded-2xl shadow-panel w-full max-w-4xl max-h-[88vh] overflow-y-auto">
          <div className="flex items-center justify-between px-5 py-4 border-b border-neutral-100 sticky top-0 bg-white rounded-t-2xl z-10">
            <div>
              <div className="text-[11px] text-neutral-400 uppercase tracking-wide">{kpi.bloco} · {kpi.subBloco || kpi.pic}</div>
              <h3 className="text-base font-bold text-neutral-800">{kpi.kpi} — Histórico completo</h3>
            </div>
            <button onClick={onClose} className="p-1.5 rounded-full hover:bg-neutral-100 text-neutral-500">
              <Icons.X size={18} />
            </button>
          </div>

          <div className="p-5 space-y-5">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <div className="flex gap-1.5">
                {PERIODS.map((p) => (
                  <button
                    key={p.key}
                    onClick={() => setPeriod(p.key)}
                    className={"px-3 py-1.5 rounded-md text-xs font-medium border transition-colors " +
                      (period === p.key ? "bg-brand text-white border-brand" : "bg-white text-neutral-600 border-neutral-200 hover:bg-neutral-50")}
                  >
                    {p.label}
                  </button>
                ))}
              </div>
              <div className="flex gap-1.5">
                {[["daily", "Diário"], ["weekly", "Semanal"], ["monthly", "Mensal"]].map(([k, l]) => (
                  <button
                    key={k}
                    onClick={() => setGranularity(k)}
                    className={"px-2.5 py-1 rounded-md text-[11px] font-medium border transition-colors " +
                      (granularity === k ? "bg-neutral-800 text-white border-neutral-800" : "bg-white text-neutral-500 border-neutral-200 hover:bg-neutral-50")}
                  >
                    {l}
                  </button>
                ))}
              </div>
            </div>

            {period === "custom" && (
              <div className="flex items-center gap-2 text-xs text-neutral-600">
                <span>De</span>
                <input type="date" value={customFrom} min={bounds.min} max={customTo} onChange={(e) => setCustomFrom(e.target.value)} className="border border-neutral-200 rounded-md px-2 py-1" />
                <span>até</span>
                <input type="date" value={customTo} min={customFrom} max={bounds.max} onChange={(e) => setCustomTo(e.target.value)} className="border border-neutral-200 rounded-md px-2 py-1" />
              </div>
            )}

            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <StatCard label="Target" value={Fmt.formatTarget(kpi)} />
              <StatCard label="Média do período" value={Fmt.formatKpiValue(kpi, st.avg)} sub={st.count + " dias com dado"} />
              <StatCard label="Máximo" value={Fmt.formatKpiValue(kpi, st.max)} />
              <StatCard label="Mínimo" value={Fmt.formatKpiValue(kpi, st.min)} />
            </div>

            <div className="rounded-xl border border-neutral-200 p-4">
              <div className="text-[13px] font-semibold text-neutral-700 mb-3">
                Evolução {granularity === "daily" ? "diária" : granularity === "weekly" ? "semanal" : "mensal"}
              </div>
              <HistoryLineChart labels={labels} values={values} targetValue={targetChart} unit={kpi.unit} kpi={kpi} />
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div className="rounded-lg border border-neutral-200 px-3.5 py-3">
                <div className="text-[11px] text-neutral-500 mb-1">Comparação WoW (semana vs semana anterior)</div>
                <div className="text-sm font-semibold text-neutral-800">{wow ? (wow.previous.label + " → " + wow.current.label) : "—"}</div>
                <div className="text-sm text-neutral-600 mt-0.5">{deltaLabel(wow)}</div>
              </div>
              <div className="rounded-lg border border-neutral-200 px-3.5 py-3">
                <div className="text-[11px] text-neutral-500 mb-1">Comparação MoM (mês vs mês anterior)</div>
                <div className="text-sm font-semibold text-neutral-800">{mom ? (mom.previous.label + " → " + mom.current.label) : "—"}</div>
                <div className="text-sm text-neutral-600 mt-0.5">{deltaLabel(mom)}</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    );
  }

  window.Components = window.Components || {};
  window.Components.HistoryModal = HistoryModal;
})();

</script>
<script type="text/babel" data-presets="react">
// components/KPIModal.js — painel lateral de análise do KPI selecionado.
(function () {
  const { useState, useEffect, useRef } = React;

  function SummaryStat({ label, value, valueClass }) {
    return (
      <div className="flex-1 text-center">
        <div className="text-[11px] text-neutral-500 mb-1">{label}</div>
        <div className={"text-xl font-bold " + (valueClass || "text-neutral-800")}>{value}</div>
      </div>
    );
  }

  function KPIModal({ kpi, selectedIso, onClose }) {
    const [visible, setVisible] = useState(false);
    const [showHistory, setShowHistory] = useState(false);
    const panelRef = useRef(null);

    useEffect(() => {
      // setTimeout (não rAF) para o painel abrir mesmo se a aba estiver em
      // segundo plano/inativa, onde requestAnimationFrame pode nunca disparar.
      const t = setTimeout(() => setVisible(true), 10);
      return () => clearTimeout(t);
    }, [kpi.id]);

    useEffect(() => {
      function onEsc(e) { if (e.key === "Escape") { if (!showHistory) onClose(); } }
      document.addEventListener("keydown", onEsc);
      return () => document.removeEventListener("keydown", onEsc);
    }, [showHistory]);

    function handleOverlayClick(e) {
      if (panelRef.current && !panelRef.current.contains(e.target)) onClose();
    }

    const value = Calc.getValue(kpi, selectedIso);

    const prevIso = Calc.prevDayIso(selectedIso);
    const valuePrev = Calc.getValue(kpi, prevIso);
    const deltaD1 = Calc.delta(value, valuePrev);

    // status único (5 rótulos), calculado uma vez e reaproveitado em todo o
    // painel — tendência em relação ao D-1, que é a comparação mais recente.
    const statusLabel = StatusUtil.computeStatusLabel(kpi, value, valuePrev, selectedIso);
    const sc = StatusUtil.STATUS_CLASSES[statusLabel.color];

    const refWeeks = DataService.getRefWeeks();
    const refWeekLabel = refWeeks[refWeeks.length - 1];
    const valueRefWeek = Calc.getValueForKey(kpi, refWeekLabel);
    const deltaRefWeek = Calc.delta(value, valueRefWeek);

    const turnoEntries = Calc.getTurnoEntries(kpi, selectedIso, DataService);
    const trailingDays = DataService.getDays().filter((d) => d.iso <= selectedIso).slice(-6);
    const trailingValues = trailingDays.map((d) => Calc.getValue(kpi, d.iso));
    const insights = Calc.generateInsights(kpi, { statusLabel, value, deltaD1, deltaRefWeek, refWeekLabel, turnoEntries, trailingValues });

    const isUrl = /^https?:\/\//.test(kpi.fonte || "");

    return (
      <>
        <div
          className="fixed inset-0 z-50 bg-black/30 overlay-fade"
          style={{ opacity: visible ? 1 : 0 }}
          onMouseDown={handleOverlayClick}
        >
          <div
            ref={panelRef}
            onMouseDown={(e) => e.stopPropagation()}
            className={"absolute right-0 top-0 bottom-0 w-full sm:w-[540px] bg-white shadow-panel flex flex-col " + (visible ? "slide-panel-active" : "slide-panel-enter")}
          >
            {/* header */}
            <div className="flex items-start justify-between gap-3 px-5 py-4 border-b border-neutral-100">
              <div className="flex items-start gap-2.5 min-w-0">
                <span className="text-lg leading-none mt-0.5">{statusLabel.dot}</span>
                <div className="min-w-0">
                  <div className="text-[11px] text-neutral-400 uppercase tracking-wide truncate">
                    {kpi.bloco} {kpi.pic ? "· " + kpi.pic : ""} {kpi.subBloco ? "· " + kpi.subBloco : ""}
                  </div>
                  <h3 className="text-[16px] font-bold text-neutral-800 leading-snug">{kpi.kpi}</h3>
                  <div className="text-[11px] text-neutral-400 mt-0.5">{Fmt.formatDateFull(selectedIso)}
                    {isUrl && (
                      <a href={kpi.fonte} target="_blank" rel="noopener" className="ml-2 text-brand hover:underline inline-flex items-center gap-0.5">
                        Fonte <Icons.ExternalLink size={10} />
                      </a>
                    )}
                  </div>
                </div>
              </div>
              <button onClick={onClose} className="p-1.5 rounded-full hover:bg-neutral-100 text-neutral-500 shrink-0">
                <Icons.X size={18} />
              </button>
            </div>

            <div className="flex-1 overflow-y-auto px-5 py-4 space-y-5">
              {/* resumo */}
              <div className="rounded-xl border border-neutral-200 divide-y divide-neutral-100 overflow-hidden">
                <div className="flex items-stretch divide-x divide-neutral-100 py-3">
                  <SummaryStat label="Resultado" value={Fmt.formatKpiValue(kpi, value)} />
                  <SummaryStat label="Target" value={Fmt.formatTarget(kpi)} />
                </div>
                <div className="px-4 py-2.5 flex items-center justify-center">
                  <span className={"inline-flex items-center justify-center gap-1.5 rounded-full px-3 py-1.5 text-[12.5px] font-semibold text-center " + sc.bg + " " + sc.text}>
                    {statusLabel.dot} {statusLabel.text}
                  </span>
                </div>
              </div>

              {/* variações */}
              <div>
                <h4 className="text-[13px] font-semibold text-neutral-700 mb-2">Variações</h4>
                <div className="grid grid-cols-2 gap-3">
                  <div className="rounded-lg bg-neutral-50 px-3 py-2.5">
                    <div className="text-[11px] text-neutral-500">vs D-1 ({Fmt.formatDateShort(prevIso)})</div>
                    <div className={"text-[15px] font-semibold mt-0.5 " + deltaTone(kpi, deltaD1)}>{Fmt.formatDelta(kpi, deltaD1)}</div>
                  </div>
                  <div className="rounded-lg bg-neutral-50 px-3 py-2.5">
                    <div className="text-[11px] text-neutral-500">vs {refWeekLabel}</div>
                    <div className={"text-[15px] font-semibold mt-0.5 " + deltaTone(kpi, deltaRefWeek)}>{Fmt.formatDelta(kpi, deltaRefWeek)}</div>
                  </div>
                </div>
              </div>

              {/* evolução */}
              <div>
                <h4 className="text-[13px] font-semibold text-neutral-700 mb-2">Evolução</h4>
                <div className="rounded-xl border border-neutral-200 p-3">
                  <Components.KPIChart kpi={kpi} selectedIso={selectedIso} />
                </div>
              </div>

              <Components.ShiftTable entries={turnoEntries} />

              <Components.InsightPanel key={kpi.id + selectedIso} manualInsight={kpi.insights ? kpi.insights[selectedIso] : null} autoInsights={insights} />
            </div>

            <div className="px-5 py-4 border-t border-neutral-100">
              <button
                onClick={() => setShowHistory(true)}
                className="w-full flex items-center justify-center gap-2 rounded-lg bg-neutral-800 hover:bg-neutral-900 text-white text-sm font-medium py-2.5 transition-colors"
              >
                <Icons.TrendingUp size={15} /> Ver histórico completo
              </button>
            </div>
          </div>
        </div>

        {showHistory && (
          <Components.HistoryModal kpi={kpi} selectedIso={selectedIso} onClose={() => setShowHistory(false)} />
        )}
      </>
    );
  }

  function deltaTone(kpi, d) {
    const improved = Calc.isImprovement(kpi, d);
    if (improved === true) return "text-ok-text";
    if (improved === false) return "text-bad-text";
    return "text-neutral-500";
  }

  window.Components = window.Components || {};
  window.Components.KPIModal = KPIModal;
})();

</script>
<script type="text/babel" data-presets="react">
// components/FillDataModal.js — preenchimento manual da árvore direto do
// front (pedido do Roberto em 2026-08-17). Escolhe uma data + um PIC, e
// só então aparecem os Sub Blocos/KPIs daquele PIC pra preencher.
//
// Regra de escrita (a mesma pro backend, ver api/_arvore.js
// writeArvoreValores): campo preenchido -> sobrescreve a célula; campo
// vazio E já tinha valor real na planilha -> mantém como está (não
// escreve); campo vazio E a célula já estava vazia/"-" -> escreve "-"
// (mesmo texto que a própria planilha já usa pra "sem dado"). O front
// manda TODOS os KPIs do PIC (preenchidos ou não) pro backend aplicar
// essa regra linha a linha — não só os que o usuário digitou.
(function () {
  const { useState, useMemo } = React;

  function FillDataModal({ onClose }) {
    const [date, setDate] = useState(DataService.getDefaultDate());
    const [pic, setPic] = useState("");
    const [values, setValues] = useState({}); // kpiId -> texto digitado
    const [comments, setComments] = useState({}); // kpiId -> comentário digitado
    const [openComments, setOpenComments] = useState({}); // kpiId -> bool (campo de comentário visível)
    const [saving, setSaving] = useState(false);
    const [result, setResult] = useState(null); // { ok, message }

    const picOptions = useMemo(() => {
      const set = new Set(DataService.getKPIs().map((k) => k.pic).filter(Boolean));
      return [...set].sort((a, b) => a.localeCompare(b, "pt-BR"));
    }, []);

    // Bloco -> Sub Bloco -> KPIs, só do PIC selecionado (reaproveita o
    // mesmo agrupador da tabela principal, já preserva a ordem da planilha).
    // KPIs calculados (k.calculado, ver api/_arvore.js) não entram aqui —
    // são derivados de outros 2 KPIs da árvore, digitar valor neles não
    // faz nada (a próxima carga sobrescreve com o cálculo automático).
    const grupos = useMemo(() => {
      if (!pic) return [];
      return DataService.getGroupedKPIs((k) => k.pic === pic).flatMap((b) =>
        b.pics.flatMap((p) => p.subs
          .map((s) => ({ bloco: b.bloco, subBloco: s.subBloco, kpis: s.kpis.filter((k) => !k.calculado) }))
          .filter((s) => s.kpis.length))
      );
    }, [pic]);

    // Vírgula com exatamente 3 dígitos depois ("208,284") é o padrão
    // clássico de separador de milhar em inglês — mas aqui a leitura é pt-BR
    // (vírgula = decimal), então isso vira 208.284 em vez de 208284 (achado
    // real em dados históricos do bloco Rodrigo, pedido do Roberto em
    // 2026-08-18). Só um aviso, não bloqueia — pode ser um decimal de
    // verdade com 3 casas (raro, mas existe nos dados antigos).
    function pareceMilharComVirgula(text) {
      return /^-?\d{1,3},\d{3}$/.test(text.trim());
    }

    function setValue(kpiId, text) {
      setValues((v) => ({ ...v, [kpiId]: text }));
    }
    function setComment(kpiId, text) {
      setComments((c) => ({ ...c, [kpiId]: text }));
    }
    function toggleComment(kpiId) {
      setOpenComments((o) => ({ ...o, [kpiId]: !o[kpiId] }));
    }

    async function handleSave() {
      if (!pic || saving) return;
      setSaving(true);
      setResult(null);
      const kpisDoGrupo = grupos.flatMap((g) => g.kpis);
      const entries = kpisDoGrupo.map((k) => ({
        bloco: k.bloco, pic: k.pic, subBloco: k.subBloco, kpi: k.kpi, data: date,
        valor: (values[k.id] || "").trim(),
        observacao: (comments[k.id] || "").trim(),
      }));
      try {
        const r = await fetch("/api/overview?arvore=1&write=1", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ entries }),
        });
        const j = await r.json();
        if (!j.ok) throw new Error(j.erro || "Falha ao salvar");
        setResult({ ok: true, message: `${j.escritos} célula(s) atualizada(s)${j.naoEncontrados && j.naoEncontrados.length ? ` · ${j.naoEncontrados.length} não encontrada(s)` : ""}.` });
        setValues({});
        setComments({});
        setOpenComments({});
        // Cache-buster (_fresh) — sem isso o reload caía dentro da janela
        // de 5min de cache do CDN e mostrava o valor antigo, mesmo com a
        // escrita já confirmada (achado pelo Roberto em 2026-08-17).
        setTimeout(() => { window.location.href = window.location.pathname + "?_fresh=" + Date.now(); }, 1400);
      } catch (err) {
        setResult({ ok: false, message: err.message });
      } finally {
        setSaving(false);
      }
    }

    return (
      <div className="fixed inset-0 z-50 bg-black/30 flex items-center justify-center p-4" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
        <div className="anim-pop bg-white rounded-xl shadow-panel w-full max-w-2xl max-h-[88vh] flex flex-col" onMouseDown={(e) => e.stopPropagation()}>
          <div className="flex items-center justify-between gap-3 px-5 py-4 border-b border-neutral-100">
            <div className="flex items-center gap-2.5">
              <div className="h-8 w-8 rounded-lg bg-brand/10 text-brand flex items-center justify-center"><Icons.Edit size={16} /></div>
              <div>
                <h3 className="text-[15px] font-bold text-neutral-800">Preencher dados</h3>
                <div className="text-[11px] text-neutral-400">Escreve direto na planilha árvore_pulso</div>
              </div>
            </div>
            <button onClick={onClose} className="p-1.5 rounded-full hover:bg-neutral-100 text-neutral-500"><Icons.X size={18} /></button>
          </div>

          <div className="px-5 py-4 border-b border-neutral-100 flex flex-wrap gap-3 items-end">
            <div>
              <label className="block text-[11px] font-medium text-neutral-500 mb-1">Data</label>
              <input type="date" value={date} onChange={(e) => setDate(e.target.value)}
                className="rounded-lg border border-neutral-300 px-3 py-1.5 text-sm" />
            </div>
            <div className="flex-1 min-w-[180px]">
              <label className="block text-[11px] font-medium text-neutral-500 mb-1">PIC</label>
              <select value={pic} onChange={(e) => { setPic(e.target.value); setValues({}); setResult(null); }}
                className="w-full rounded-lg border border-neutral-300 px-3 py-1.5 text-sm bg-white">
                <option value="">Selecione um PIC…</option>
                {picOptions.map((p) => <option key={p} value={p}>{p}</option>)}
              </select>
            </div>
          </div>

          <div className="flex-1 overflow-y-auto px-5 py-4">
            {!pic && (
              <div className="text-center text-sm text-neutral-400 py-10">Selecione um PIC pra ver os KPIs dele.</div>
            )}
            {pic && grupos.length === 0 && (
              <div className="text-center text-sm text-neutral-400 py-10">Nenhum KPI encontrado pra esse PIC.</div>
            )}
            {grupos.map((g) => (
              <div key={g.bloco + "|" + g.subBloco} className="mb-5">
                <div className="text-[11px] font-semibold text-neutral-400 uppercase tracking-wide mb-2">{g.bloco} · {g.subBloco}</div>
                <div className="space-y-2">
                  {g.kpis.map((k) => {
                    const atual = Calc.getValue(k, date);
                    const obsAtual = k.insights ? k.insights[date] : null;
                    const commentOpen = !!openComments[k.id];
                    return (
                      <div key={k.id} className="rounded-lg border border-neutral-200 px-3 py-2">
                        <div className="flex items-center gap-3">
                          <div className="flex-1 min-w-0">
                            <div className="text-[13px] text-neutral-700 truncate">{k.kpi}</div>
                            <div className="text-[11px] text-neutral-400">Atual em {Fmt.formatDateShort(date)}: {Fmt.formatKpiValue(k, atual)}</div>
                          </div>
                          <button
                            type="button"
                            onClick={() => toggleComment(k.id)}
                            title={obsAtual ? "Já tem comentário — clique pra ver/editar" : "Adicionar comentário"}
                            className={"p-1.5 rounded-lg border " + (commentOpen || obsAtual ? "border-brand/40 bg-brand-tint/40 text-brand-dark" : "border-neutral-200 text-neutral-400 hover:bg-neutral-50")}
                          >
                            <Icons.MessageSquare size={14} />
                          </button>
                          <div>
                            <input
                              type="text"
                              value={values[k.id] || ""}
                              onChange={(e) => setValue(k.id, e.target.value)}
                              placeholder={k.unit === "percent" ? "ex: 85,3%" : "novo valor"}
                              className={"w-32 rounded-lg border px-2.5 py-1.5 text-sm text-right " + (pareceMilharComVirgula(values[k.id] || "") ? "border-warn text-warn-text" : "border-neutral-300")}
                            />
                            {pareceMilharComVirgula(values[k.id] || "") && (
                              <div className="text-[10px] text-warn-text mt-0.5 w-32 text-right">vírgula = decimal aqui; milhar não leva vírgula</div>
                            )}
                          </div>
                        </div>
                        {commentOpen && (
                          <div className="mt-2">
                            {obsAtual && (
                              <div className="text-[11px] text-neutral-400 mb-1">Comentário atual: {obsAtual}</div>
                            )}
                            <textarea
                              value={comments[k.id] || ""}
                              onChange={(e) => setComment(k.id, e.target.value)}
                              placeholder="Comentário pra essa data (fica em branco = mantém o atual)"
                              rows={2}
                              className="w-full rounded-lg border border-neutral-300 px-2.5 py-1.5 text-sm resize-none"
                            />
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>

          <div className="px-5 py-4 border-t border-neutral-100 flex items-center gap-3">
            {result && (
              <span className={"text-[12.5px] flex-1 " + (result.ok ? "text-ok-text" : "text-bad-text")}>{result.message}</span>
            )}
            <button
              onClick={handleSave}

</script>
<script type="text/babel" data-presets="react">

<script type="text/babel" data-presets="react">
// components/Filters.js — busca + filtros por Bloco/PIC/Mês/Semana, em
// tempo real. Mês e Semana são multiseleção e funcionam em conjunto: a

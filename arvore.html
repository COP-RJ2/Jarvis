<script type="text/babel" data-presets="react">
// components/KPITable.js — a árvore de KPI's completa: hierarquia
// Bloco/PIC/Sub Bloco/KPI congelada à esquerda, Target + 2 semanas de
// referência também congeladas, e a linha do tempo em 3 níveis
// Mês → Semana → Dia. Semanas iniciam fechadas (mostrando só o resultado
// consolidado) e podem ser abertas/fechadas individualmente, várias ao
// mesmo tempo. Filtros de Mês/Semana são multiseleção.
(function () {
  const { useState, useMemo, useEffect, useRef } = React;

  // Colunas de valor (target/ref/week/day) alargadas pra caber números até
  // 7 dígitos (ex.: 1.999.999) sem cortar — pedido do Roberto em 2026-08-14.
  const COLW = { bloco: 34, pic: 92, sub: 132, kpi: 224, target: 76, week: 92, day: 76 };
  const ROW1_H = 24; // altura da linha de Mês
  const ROW2_H = 26; // altura da linha de Semana
  const ROW3_H = 32; // altura da linha de Dia

  function normalize(s) {
    return (s || "").toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  }

  function spanLen(entries, start, keyFn) {
    let j = start + 1;
    while (j < entries.length && keyFn(entries[j]) === keyFn(entries[start])) j++;
    return j - start;
  }

  function cssEscape(s) {
    return window.CSS && CSS.escape ? CSS.escape(s) : s.replace(/(["\\])/g, "\\$1");
  }

  function FrozenTh({ label, left, width, className, onClick, title }) {
    return (
      <th
        rowSpan={3}
        onClick={onClick}
        title={title}
        style={{ left, width, minWidth: width, top: 0 }}
        className={"frozen-col bg-brand text-white text-[11px] font-semibold px-2 py-2 border-r border-white/20 " + (className || "")}
      >
        {label}
      </th>
    );
  }

  function KPITable({ selectedIso, onDateChange, selectedKpiId, onSelectKpi, filters, onFiltersChange, density }) {
    const cellPad = density === "compact" ? "py-0.5" : "py-1.5";
    const allKpis = DataService.getKPIs();
    const blocks = DataService.getBlocks();
    const pics = useMemo(() => Array.from(new Set(allKpis.map((k) => k.pic).filter(Boolean))).sort(), []);
    const days = DataService.getDays();
    const allWeeks = DataService.getWeeks();

    const daysByWeek = useMemo(() => {
      const m = {};
      days.forEach((d) => { (m[d.wk] = m[d.wk] || []).push(d); });
      return m;
    }, [days]);

    // ---------------------------------------------------------------
    // Filtro de período: Mês e Semana são multiseleção, e "vazio" significa
    // "todos" (sem restrição) — não "mês atual". A tabela começa com os 2
    // meses (atual + anterior) já marcados por padrão, mas isso é só o
    // estado inicial do filtro; a partir daí é seleção normal do usuário.
    // O filtro de Semana é dependente do de Mês: sem mês marcado, mostra
    // todas as semanas do histórico; com mês(es) marcado(s), só as semanas
    // daqueles meses — e uma semana que deixa de pertencer aos meses
    // marcados sai automaticamente da seleção ativa.
    // ---------------------------------------------------------------
    const [selectedMonths, setSelectedMonths] = useState(() => Calc.getDefaultMonths(selectedIso));
    const [selectedWeeks, setSelectedWeeks] = useState([]);

    const allMonthOptions = useMemo(
      () => DataService.getMonthOptions().map((m) => ({ value: m, label: Fmt.formatMonthLabel(m) })),
      []
    );

    const effectiveMonths = useMemo(() => {
      if (selectedMonths.length === 0) return allMonthOptions.map((o) => o.value);
      return selectedMonths.slice().sort();
    }, [selectedMonths, allMonthOptions]);

    const weekOptions = useMemo(() => {
      return allWeeks
        .filter((w) => effectiveMonths.includes(w.startIso.slice(0, 7)))
        .map((w) => ({ value: w.label, label: `${w.label} (${Fmt.formatDateShort(w.startIso)}–${Fmt.formatDateShort(w.endIso)})` }));
    }, [allWeeks, effectiveMonths]);

    // remove da seleção ativa semanas que deixaram de pertencer aos meses marcados
    useEffect(() => {
      if (selectedMonths.length === 0) return; // "todos os meses" -> nenhuma semana fica inválida
      const validLabels = new Set(
        allWeeks.filter((w) => selectedMonths.includes(w.startIso.slice(0, 7))).map((w) => w.label)
      );
      setSelectedWeeks((prev) => {
        const pruned = prev.filter((label) => validLabels.has(label));
        return pruned.length === prev.length ? prev : pruned;
      });
      // eslint-disable-next-line
    }, [selectedMonths]);

    // ---------------------------------------------------------------
    // Semanas abertas/fechadas — iniciam fechadas, exceto a semana da
    // data selecionada (pra sempre dar pra ver o dia em análise sem
    // precisar clicar) e a semana de hoje (pra linha do dia atual já
    // aparecer sem exigir clique). Várias podem ficar abertas ao mesmo tempo.
    // ---------------------------------------------------------------
    const [openWeeks, setOpenWeeks] = useState(() => {
      const wk = (DataService.getDayByIso(selectedIso) || {}).wk;
      const todayWk = (DataService.getDayByIso(Calc.getTodayIso()) || {}).wk;
      return new Set([wk, todayWk].filter(Boolean));
    });

    useEffect(() => {
      const wk = (DataService.getDayByIso(selectedIso) || {}).wk;
      if (!wk) return;
      setOpenWeeks((prev) => (prev.has(wk) ? prev : new Set(prev).add(wk)));
    }, [selectedIso]);

    function toggleWeek(label) {
      setOpenWeeks((prev) => {
        const next = new Set(prev);
        if (next.has(label)) next.delete(label);
        else next.add(label);
        return next;
      });
    }

    const gridWrapRef = useRef(null);

    useEffect(() => {
      const t = setTimeout(() => {
        const wrap = gridWrapRef.current;
        if (!wrap) return;
        const th = wrap.querySelector(`th[data-iso="${cssEscape(selectedIso)}"]`);
        if (!th) return;
        const targetLeft = th.offsetLeft - wrap.clientWidth * 0.6;
        wrap.scrollTo({ left: Math.max(0, targetLeft), behavior: "smooth" });
      }, 60);
      return () => clearTimeout(t);
      // eslint-disable-next-line
    }, [selectedIso]);

    const filtered = useMemo(() => {
      const q = normalize(filters.search);
      return allKpis.filter((k) => {
        if (filters.bloco && k.bloco !== filters.bloco) return false;
        if (filters.pic && k.pic !== filters.pic) return false;
        if (q) {
          const hay = normalize(`${k.kpi} ${k.bloco} ${k.subBloco} ${k.pic}`);
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }, [filters]);

    const rows = useMemo(() => {
      const out = [];
      for (let i = 0; i < filtered.length; i++) {
        const e = filtered[i];
        const isBlocoStart = i === 0 || filtered[i - 1].bloco !== e.bloco;
        const blocoSpan = isBlocoStart ? spanLen(filtered, i, (x) => x.bloco) : 0;
        const isPicStart = isBlocoStart || filtered[i - 1].pic !== e.pic;
        const picSpan = isPicStart ? spanLen(filtered, i, (x) => x.bloco + "|" + x.pic) : 0;
        const isSubStart = isPicStart || filtered[i - 1].subBloco !== e.subBloco;
        const subSpan = isSubStart ? spanLen(filtered, i, (x) => x.bloco + "|" + x.pic + "|" + x.subBloco) : 0;
        out.push({ kpi: e, isBlocoStart, blocoSpan, picSpan, subSpan });
      }
      return out;
    }, [filtered]);

    // offsets das colunas congeladas
    const off = {};
    let frozenTotal = 0;
    { let acc = 0;
      off.bloco = acc; acc += COLW.bloco;
      off.pic = acc; acc += COLW.pic;
      off.sub = acc; acc += COLW.sub;
      off.kpi = acc; acc += COLW.kpi;
      off.target = acc; acc += COLW.target;
      frozenTotal = acc;
    }

    // ---------------------------------------------------------------
    // Monta a hierarquia Mês -> Semana -> (dias, se aberta) e a lista
    // plana de colunas-folha (o que de fato vira uma <td> na tabela).
    // ---------------------------------------------------------------
    const { monthGroups, leaves, tableWidth } = useMemo(() => {
      const leavesOut = [];
      const monthGroupsOut = [];
      let x = frozenTotal;
      effectiveMonths.forEach((monthKey) => {
        const weeksAll = allWeeks.filter((w) => w.startIso.slice(0, 7) === monthKey);
        const weeksInMonth = selectedWeeks.length ? weeksAll.filter((w) => selectedWeeks.includes(w.label)) : weeksAll;
        if (!weeksInMonth.length) return;
        const weekEntries = [];
        weeksInMonth.forEach((w) => {
          const isOpen = openWeeks.has(w.label);
          const monthStart = leavesOut.length === 0 || leavesOut[leavesOut.length - 1]._monthKey !== monthKey;
          if (!isOpen) {
            const leaf = { type: "week", key: w.label, week: w, width: COLW.week, left: x, monthStart, _monthKey: monthKey };
            x += COLW.week;
            leavesOut.push(leaf);
            weekEntries.push({ week: w, isOpen: false, leafCount: 1 });
          } else {
            const wDays = daysByWeek[w.label] || [];
            // resultado da semana fica à ESQUERDA dos dias quando aberta
            leavesOut.push({ type: "weekTotal", key: w.label + "-total", week: w, width: COLW.week, left: x, monthStart, _monthKey: monthKey });
            x += COLW.week;
            wDays.forEach((d) => {
              leavesOut.push({ type: "day", key: d.iso, day: d, week: w, width: COLW.day, left: x, monthStart: false, _monthKey: monthKey });
              x += COLW.day;
            });
            weekEntries.push({ week: w, isOpen: true, leafCount: wDays.length + 1 });
          }
        });
        const leafCount = weekEntries.reduce((a, e) => a + e.leafCount, 0);
        if (leafCount > 0) monthGroupsOut.push({ monthKey, weeks: weekEntries, leafCount });
      });
      return { monthGroups: monthGroupsOut, leaves: leavesOut, tableWidth: x };
    }, [effectiveMonths, selectedWeeks, openWeeks, daysByWeek, frozenTotal]);

    // A linha do "dia atual" usa a data real do sistema — independe da
    // data/mês/semana selecionados. Se hoje não estiver na visualização
    // atual, simplesmente não mostra a linha (nada de posição alternativa).
    const todayIso = Calc.getTodayIso();
    const todayLeaf = leaves.find((l) => l.type === "day" && l.key === todayIso);
    const todayLineLeft = todayLeaf ? todayLeaf.left + todayLeaf.width : null;

    function DataCell({ kpi, colKey, frozen, left, monthStart, aggregate }) {
      const value = Calc.getValueForKey(kpi, colKey);
      const compareValue = Calc.getValueForKey(kpi, Calc.prevPeriodKey(colKey));
      const statusLabel = StatusUtil.computeStatusLabel(kpi, value, compareValue, colKey);
      const sc = StatusUtil.STATUS_CLASSES[statusLabel.color];
      const display = Fmt.formatKpiValue(kpi, value);
      const isSelected = kpi.id === selectedKpiId;
      const width = frozen || aggregate ? COLW.week : COLW.day;
      const isDayCell = !frozen && !aggregate;
      return (
        <td
          onClick={() => onSelectKpi(kpi.id, isDayCell ? colKey : undefined)}
          data-iso={isDayCell ? colKey : undefined}
          title={kpi.kpi + " — " + display + (statusLabel.key !== "na" ? " · " + statusLabel.text : "")}
          style={frozen ? { left, width, minWidth: width } : { width, minWidth: width }}
          className={[
            "kpi-cell text-center text-[12px] px-1 border-r border-b",
            cellPad,
            frozen ? "frozen-col border-neutral-200 font-semibold" : "border-neutral-100",
            aggregate ? "font-semibold bg-opacity-70" : "",
            monthStart ? "month-start" : "",
            statusLabel.key === "na" ? "text-neutral-400 bg-white" : sc.text + " " + sc.bg,
            isSelected ? "is-selected" : "",
          ].join(" ")}
        >
          {display}
        </td>
      );
    }

    return (
      <div className="flex flex-col h-full">
        <Components.Filters
          filters={filters}
          onChange={onFiltersChange}
          blocks={blocks}
          pics={pics}
          resultCount={filtered.length}
          monthOptions={allMonthOptions}
          selectedMonths={selectedMonths}
          onMonthsChange={setSelectedMonths}
          onMonthsSelectAll={() => setSelectedMonths(allMonthOptions.map((o) => o.value))}
          onMonthsReset={() => setSelectedMonths([])}
          weekOptions={weekOptions}
          selectedWeeks={selectedWeeks}
          onWeeksChange={setSelectedWeeks}
          onWeeksSelectAll={() => setSelectedWeeks(weekOptions.map((o) => o.value))}
          onWeeksReset={() => setSelectedWeeks([])}
        />

        <div className="flex items-center justify-between px-4 py-2 bg-neutral-50 border-b border-neutral-200">
          <Components.DateNav selectedIso={selectedIso} onChange={onDateChange} />
          <div className="hidden lg:flex items-center gap-3 text-[11px] text-neutral-500">
            <span className="inline-flex items-center gap-1"><span className="h-2.5 w-2.5 rounded-sm bg-ok-bg ring-1 ring-ok/40"></span> Dentro do target</span>
            <span className="inline-flex items-center gap-1"><span className="h-2.5 w-2.5 rounded-sm bg-warn-bg ring-1 ring-warn/40"></span> Próximo do target</span>
            <span className="inline-flex items-center gap-1"><span className="h-2.5 w-2.5 rounded-sm bg-bad-bg ring-1 ring-bad/40"></span> Fora do target</span>
            <span className="inline-flex items-center gap-1"><span className="h-2.5 w-2.5 rounded-sm bg-na-bg ring-1 ring-na/40"></span> Sem dado</span>
            <span className="text-neutral-300">|</span>
            <span className="inline-flex items-center gap-1"><span className="inline-block w-[2px] h-3 bg-brand"></span> Hoje</span>
            <span className="text-neutral-300">|</span>
            <span>▶ semana fechada · ▼ semana aberta</span>
          </div>
        </div>

        <div ref={gridWrapRef} className="flex-1 overflow-auto bg-white">
          <div className="relative" style={{ width: tableWidth }}>
            <table className="kpi-grid text-[12px]" style={{ width: tableWidth, minWidth: tableWidth }}>
              <colgroup>
                <col style={{ width: COLW.bloco }} />
                <col style={{ width: COLW.pic }} />
                <col style={{ width: COLW.sub }} />
                <col style={{ width: COLW.kpi }} />
                <col style={{ width: COLW.target }} />
                {leaves.map((l) => <col key={l.key} style={{ width: l.width }} />)}
              </colgroup>
              <thead>
                <tr>
                  <FrozenTh label="Bloco" left={off.bloco} width={COLW.bloco} />
                  <FrozenTh label="PIC" left={off.pic} width={COLW.pic} />
                  <FrozenTh label="Sub Bloco" left={off.sub} width={COLW.sub} />
                  <FrozenTh label="KPI" left={off.kpi} width={COLW.kpi} className="text-left" />
                  <FrozenTh label="Target" left={off.target} width={COLW.target} />

                  {monthGroups.map((g) => (
                    <th key={g.monthKey} colSpan={g.leafCount}
                      className="bg-neutral-700 text-white text-[11px] font-bold uppercase tracking-wide px-2 border-r border-white/10 month-start"
                      style={{ top: 0, height: ROW1_H }}>
                      {Fmt.formatMonthLabel(g.monthKey)}
                    </th>
                  ))}
                </tr>
                <tr>
                  {monthGroups.flatMap((g) =>
                    g.weeks.map((we) =>
                      we.isOpen ? (
                        <th key={we.week.label} colSpan={we.leafCount} onClick={() => toggleWeek(we.week.label)}
                          className="bg-brand-dark text-white text-[11px] font-semibold px-1.5 border-r border-white/20 cursor-pointer hover:bg-brand-light select-none"
                          style={{ top: ROW1_H, height: ROW2_H }} title="Clique para fechar a semana">
                          <span className="mr-1">▼</span>{we.week.label}
                        </th>
                      ) : (
                        <th key={we.week.label} rowSpan={2} onClick={() => toggleWeek(we.week.label)}
                          className="bg-brand-dark text-white text-[11px] font-semibold px-1.5 border-r border-white/20 cursor-pointer hover:bg-brand-light select-none"
                          style={{ top: ROW1_H, height: ROW2_H + ROW3_H }} title="Clique para abrir a semana">
                          <span className="mr-1">▶</span>{we.week.label}
                        </th>
                      )
                    )
                  )}
                </tr>
                <tr>
                  {monthGroups.flatMap((g) =>
                    g.weeks.filter((we) => we.isOpen).flatMap((we) => {
                      const wDays = daysByWeek[we.week.label] || [];
                      const dayThs = wDays.map((d) => (
                        <th key={d.iso} data-iso={d.iso}
                          className="bg-brand-dark text-white text-[10.5px] font-medium px-1 border-r border-white/20"
                          style={{ width: COLW.day, minWidth: COLW.day, top: ROW1_H + ROW2_H, height: ROW3_H }}>
                          <div>{Fmt.formatDateShort(d.iso)}</div>
                          <div className="text-[9px] opacity-75 font-normal">{d.wd}</div>
                        </th>
                      ));
                      const totalTh = (
                        <th key={we.week.label + "-total"}
                          className="bg-brand-dark/90 text-white text-[10.5px] font-semibold px-1 border-r border-white/20"
                          style={{ width: COLW.week, minWidth: COLW.week, top: ROW1_H + ROW2_H, height: ROW3_H }} title="Resultado consolidado da semana">
                          {we.week.label}
                        </th>
                      );
                      return [totalTh].concat(dayThs);
                    })
                  )}
                </tr>
              </thead>
              <tbody>
                {rows.map(({ kpi, isBlocoStart, blocoSpan, picSpan, subSpan }) => {
                  const isSelectedRow = kpi.id === selectedKpiId;
                  return (
                    <tr key={kpi.id} className={isBlocoStart ? "bloco-start-row" : ""}>
                      {blocoSpan > 0 && (
                        <td rowSpan={blocoSpan} className="frozen-col bg-brand text-white text-center align-middle border-r border-b border-white/10" style={{ left: off.bloco, width: COLW.bloco, minWidth: COLW.bloco }}>
                          <div className="bloco-vertical text-[11px] font-bold tracking-wide whitespace-nowrap py-1">{kpi.bloco}</div>
                        </td>
                      )}
                      {picSpan > 0 && (
                        <td rowSpan={picSpan} className="frozen-col bg-white text-center align-middle text-[11.5px] text-neutral-600 border-r border-b border-neutral-100 px-1.5" style={{ left: off.pic, width: COLW.pic, minWidth: COLW.pic }}>
                          {kpi.pic || "—"}
                        </td>
                      )}
                      {subSpan > 0 && (
                        <td rowSpan={subSpan} className="frozen-col bg-white align-middle text-[11.5px] text-neutral-600 border-r border-b border-neutral-100 px-2" style={{ left: off.sub, width: COLW.sub, minWidth: COLW.sub }}>
                          {kpi.subBloco || "—"}
                        </td>
                      )}
                      <td
                        onClick={() => onSelectKpi(kpi.id)}
                        className={"kpi-cell frozen-col bg-white align-middle text-[12px] font-medium text-neutral-800 border-r border-b border-neutral-100 px-2 " + cellPad + " " + (isSelectedRow ? "is-selected" : "")}
                        style={{ left: off.kpi, width: COLW.kpi, minWidth: COLW.kpi }}
                      >
                        <span className="truncate block">{kpi.kpi}</span>
                        {kpi.fonte && /^https?:\/\//.test(kpi.fonte) && (
                          <a href={kpi.fonte} target="_blank" rel="noopener" onClick={(e) => e.stopPropagation()} className="text-brand-dark" title={"Fonte: " + kpi.fonte}>
                            <Icons.ExternalLink size={10} className="inline ml-1" />
                          </a>
                        )}
                      </td>
                      <td className="frozen-col bg-neutral-50 text-center align-middle text-[11.5px] text-neutral-500 border-r border-b border-neutral-100" style={{ left: off.target, width: COLW.target, minWidth: COLW.target }}>
                        {Fmt.formatTarget(kpi)}
                      </td>

                      {leaves.map((l) => (
                        <DataCell
                          key={l.key}
                          kpi={kpi}
                          colKey={l.type === "day" ? l.day.iso : l.week.label}
                          aggregate={l.type !== "day"}
                          monthStart={l.monthStart}
                        />
                      ))}
                    </tr>
                  );
                })}
                {rows.length === 0 && (
                  <tr>
                    <td colSpan={200} className="text-center text-neutral-400 text-sm py-10">
                      Nenhum KPI encontrado para os filtros aplicados.
                    </td>
                  </tr>
                )}
              </tbody>
            </table>

            {todayLineLeft !== null && <div className="today-line" style={{ left: todayLineLeft }} />}
          </div>
        </div>
      </div>
    );
  }

  window.Components = window.Components || {};
  window.Components.KPITable = KPITable;
})();

</script>
<script type="text/babel" data-presets="react">
// components/Overview.js — resumo executivo da operação (não substitui a
// tabela). Tem filtros próprios de Data/Semana/Mês (independentes ou
// combinados) que recalculam tudo na tela: preenchimento por bloco,
// status, desvios e insights.
(function () {
  const { useState, useMemo, useEffect } = React;

  function StatTile({ label, value, tone, icon }) {
    const IconComp = Icons[icon];
    return (
      <div className="flex-1 min-w-[150px] rounded-xl border border-neutral-200 bg-white px-4 py-4 flex items-center gap-3">
        <div className={"h-10 w-10 rounded-lg flex items-center justify-center shrink-0 " + tone.bg}>
          <IconComp size={19} className={tone.text} />
        </div>
        <div>
          <div className="text-2xl font-bold text-neutral-800 leading-none">{value}</div>
          <div className="text-[12px] text-neutral-500 mt-1">{label}</div>
        </div>
      </div>
    );
  }

  function barTone(pct) {
    if (pct === null) return { bar: "#D9D9D9", text: "text-neutral-400" };
    if (pct >= 90) return { bar: "#1E8E3E", text: "text-ok-text" };
    if (pct >= 70) return { bar: "#B15C00", text: "text-warn-text" };
    return { bar: "#D93025", text: "text-bad-text" };
  }

  function Overview({ selectedIso, onSelectKpi }) {
    const allDays = DataService.getDays();
    const allWeeks = DataService.getWeeks();
    const allMonthOptions = useMemo(
      () => DataService.getMonthOptions().map((m) => ({ value: m, label: Fmt.formatMonthLabel(m) })),
      []
    );

    const [ovDate, setOvDate] = useState(selectedIso);
    const [ovMonths, setOvMonths] = useState([]);
    const [ovWeeks, setOvWeeks] = useState([]);

    const effectiveMonths = ovMonths.length ? ovMonths.slice().sort() : allMonthOptions.map((o) => o.value);
    const weekOptions = useMemo(
      () => allWeeks
        .filter((w) => effectiveMonths.includes(w.startIso.slice(0, 7)))
        .map((w) => ({ value: w.label, label: `${w.label} (${Fmt.formatDateShort(w.startIso)}–${Fmt.formatDateShort(w.endIso)})` })),
      [allWeeks, effectiveMonths.join(",")]
    );

    // poda semanas que deixaram de pertencer aos meses marcados
    useEffect(() => {
      if (ovMonths.length === 0) return;
      const valid = new Set(allWeeks.filter((w) => ovMonths.includes(w.startIso.slice(0, 7))).map((w) => w.label));
      setOvWeeks((prev) => {
        const pruned = prev.filter((w) => valid.has(w));
        return pruned.length === prev.length ? prev : pruned;
      });
      // eslint-disable-next-line
    }, [ovMonths]);

    const filteredDays = useMemo(
      () => Calc.getFilteredDays(allDays, { date: ovDate, weeks: ovWeeks, months: ovMonths }),
      [allDays, ovDate, ovWeeks, ovMonths]
    );

    const stats = DataService.computeOverviewStats(filteredDays.length ? filteredDays : [DataService.getDayByIso(selectedIso) || allDays[allDays.length - 1]]);
    const overviewInsights = Calc.generateOverviewInsights(stats);

    const hasPeriodFilter = !!ovDate || ovMonths.length > 0 || ovWeeks.length > 0;
    function clearFilters() { setOvDate(null); setOvMonths([]); setOvWeeks([]); }

    const periodLabel = filteredDays.length === 0
      ? "nenhum dia no período selecionado"
      : filteredDays.length === 1
      ? Fmt.formatDateFull(filteredDays[0].iso)
      : `${filteredDays.length} dias (${Fmt.formatDateShort(filteredDays[0].iso)}–${Fmt.formatDateShort(filteredDays[filteredDays.length - 1].iso)})`;

    return (
      <div className="p-6 space-y-6 max-w-6xl mx-auto">
        <div>
          <h2 className="text-lg font-bold text-neutral-800">Visão Geral</h2>
          <p className="text-sm text-neutral-500 mt-0.5">Resumo executivo da operação — período: {periodLabel}.</p>
        </div>

        <div className="flex flex-wrap items-center gap-2 rounded-xl border border-neutral-200 bg-white p-3">
          <span className="text-[11px] font-semibold text-neutral-400 uppercase tracking-wide mr-1">Filtros</span>
          <Components.DateFilter selectedIso={ovDate} onChange={setOvDate} />
          <Components.MultiSelect
            label="Semana"
            options={weekOptions}
            selected={ovWeeks}
            onChange={setOvWeeks}
            onSelectAll={() => setOvWeeks(weekOptions.map((o) => o.value))}
            onReset={() => setOvWeeks([])}
            isDefault={ovWeeks.length === 0}
          />
          <Components.MultiSelect
            label="Mês"
            options={allMonthOptions}
            selected={ovMonths}
            onChange={setOvMonths}
            onSelectAll={() => setOvMonths(allMonthOptions.map((o) => o.value))}
            onReset={() => setOvMonths([])}
            isDefault={ovMonths.length === 0}
          />
          {hasPeriodFilter && (
            <button onClick={clearFilters} className="flex items-center gap-1 text-xs text-neutral-400 hover:text-neutral-600 px-2">
              <Icons.X size={12} /> Limpar
            </button>
          )}
        </div>

        <div className="flex flex-wrap gap-3">
          <StatTile label="Total de KPI's" value={stats.total} tone={{ bg: "bg-neutral-100", text: "text-neutral-600" }} icon="BarChart" />
          <StatTile label="Dentro do Target" value={stats.ok} tone={{ bg: "bg-ok-bg", text: "text-ok-text" }} icon="CheckCircle" />
          <StatTile label="Atenção" value={stats.warn} tone={{ bg: "bg-warn-bg", text: "text-warn-text" }} icon="AlertTriangle" />
          <StatTile label="Fora do Target" value={stats.bad} tone={{ bg: "bg-bad-bg", text: "text-bad-text" }} icon="AlertCircle" />
          <StatTile label="Sem dado" value={stats.na} tone={{ bg: "bg-na-bg", text: "text-na-text" }} icon="MinusCircle" />
        </div>

        <div className="rounded-xl border border-neutral-200 bg-white p-5">
          <h3 className="text-[13px] font-semibold text-neutral-700 mb-1">Performance por Bloco</h3>
          <p className="text-[12px] text-neutral-400 mb-4">% de KPIs com dado preenchido no período selecionado (não avalia se está dentro ou fora do Target).</p>
          <div className="space-y-3">
            {stats.byBloco.map((b) => {
              const tone = barTone(b.pct);
              return (
                <div key={b.bloco} className="flex items-center gap-3">
                  <div className="w-28 shrink-0 text-[12.5px] text-neutral-600 truncate">{b.bloco}</div>
                  <div className="flex-1 bar-track h-2.5">
                    <div className="bar-fill h-full" style={{ width: (b.pct ?? 0) + "%", backgroundColor: tone.bar }} />
                  </div>
                  <div className={"w-12 shrink-0 text-right text-[12.5px] font-semibold " + tone.text}>{b.pct === null ? "—" : b.pct + "%"}</div>
                </div>
              );
            })}
          </div>
        </div>

        <div className="rounded-xl border border-neutral-200 bg-white p-5">
          <h3 className="text-[13px] font-semibold text-neutral-700 mb-1">Principais desvios</h3>
          <p className="text-[12px] text-neutral-400 mb-4">KPI's com maior distância percentual em relação ao target, em {Fmt.formatDateFull(stats.refIso)} (dia mais recente do período).</p>
          {stats.topDeviations.length === 0 ? (
            <div className="text-sm text-neutral-400 py-6 text-center">Nenhum desvio relevante encontrado para este período.</div>
          ) : (
            <ol className="space-y-1.5">
              {stats.topDeviations.map((d, i) => {
                const sc = StatusUtil.STATUS_CLASSES[d.statusLabel.color];
                return (
                  <li key={d.kpi.id}>
                    <button
                      onClick={() => onSelectKpi(d.kpi.id)}
                      className="w-full flex items-center gap-3 rounded-lg px-3 py-2.5 hover:bg-neutral-50 text-left transition-colors"
                    >
                      <span className="text-[12px] font-bold text-neutral-300 w-5 shrink-0">{i + 1}.</span>
                      <div className="min-w-0 flex-1">
                        <div className="text-[13px] font-medium text-neutral-800 truncate">{d.kpi.bloco} — {d.kpi.kpi}</div>
                        <div className="text-[11px] text-neutral-400 truncate">{d.kpi.subBloco || d.kpi.pic}</div>
                      </div>
                      <div className="text-right shrink-0">
                        <div className="text-[13px] font-semibold text-neutral-700">{Fmt.formatKpiValue(d.kpi, d.value)}</div>
                        <div className="text-[10.5px] text-neutral-400">meta {Fmt.formatTarget(d.kpi)}</div>
                      </div>
                      <span className={"inline-flex items-center rounded-full px-2 py-0.5 text-[10.5px] font-medium shrink-0 max-w-[150px] " + sc.bg + " " + sc.text}>
                        {d.statusLabel.dot} <span className="truncate">{d.statusLabel.text}</span>
                      </span>
                    </button>
                  </li>
                );
              })}
            </ol>
          )}
        </div>

        <div className="rounded-xl border border-neutral-200 bg-white p-5">
          <h3 className="text-[13px] font-semibold text-neutral-700 mb-4">Insights</h3>
          <Components.AutoInsightList insights={overviewInsights} />
        </div>
      </div>
    );
  }

  window.Components = window.Components || {};
  window.Components.Overview = Overview;
})();

</script>
<script type="text/babel" data-presets="react">
// components/History.js — tela dedicada de análise histórica: permite
// comparar vários KPI's ao mesmo tempo (evolução, tabela comparativa e
// dados brutos), com filtros por KPI/Bloco/Período.
(function () {
  const { useState, useMemo, useRef, useEffect } = React;

  const PALETTE = ["#EE4D2D", "#1E8E3E", "#1A73E8", "#B15C00", "#8B5CF6", "#0EA5A4", "#D93025", "#6B7280"];
  const PERIODS = [
    { key: "30", label: "30 dias", days: 30 },
    { key: "7", label: "7 dias", days: 7 },
    { key: "90", label: "90 dias", days: 90 },
    { key: "all", label: "Tudo", days: null },
  ];

  function MultiLineChart({ series, unitMixed, height = 300 }) {
    const canvasRef = useRef(null);
    const chartRef = useRef(null);
    useEffect(() => {
      if (!canvasRef.current) return;
      const ctx = canvasRef.current.getContext("2d");
      if (chartRef.current) chartRef.current.destroy();
      const labels = series.length ? series[0].points.map((p) => p.label) : [];
      chartRef.current = new Chart(ctx, {
        type: "line",
        data: {
          labels,
          datasets: series.map((s, i) => ({
            label: s.kpi.bloco + " — " + s.kpi.kpi,
            data: s.points.map((p) => (p.value === null ? null : s.kpi.unit === "percent" ? p.value * 100 : p.value)),
            borderColor: PALETTE[i % PALETTE.length],
            backgroundColor: PALETTE[i % PALETTE.length] + "22",
            borderWidth: 2,
            pointRadius: s.points.length > 45 ? 0 : 2,
            pointHoverRadius: 5,
            tension: 0.25,
            spanGaps: true,
          })),
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          interaction: { mode: "index", intersect: false },
          plugins: {
            legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 10.5 }, color: "#555" } },
            tooltip: { backgroundColor: "#242424", padding: 8 },
            datalabels: {
              display: (ctx) => {
                if (!ChartHelpers.labelsFitDensity(labels.length, series.length)) return false;
                return ctx.dataset.data[ctx.dataIndex] !== null && ctx.dataset.data[ctx.dataIndex] !== undefined;
              },
              align: (ctx) => ChartHelpers.labelAlign(ctx.dataset.data, ctx.dataIndex),
              anchor: "center",
              offset: 5,
              clamp: true,
              color: (ctx) => PALETTE[ctx.datasetIndex % PALETTE.length],
              font: { size: 9, weight: "600" },
              backgroundColor: "rgba(255,255,255,.85)",
              borderRadius: 3,
              padding: { top: 1, bottom: 1, left: 2, right: 2 },
              formatter: (v, ctx) => {
                const s = series[ctx.datasetIndex];
                const raw = s && s.points[ctx.dataIndex] ? s.points[ctx.dataIndex].value : null;
                return raw === null || raw === undefined ? "" : Fmt.formatKpiValue(s.kpi, raw);
              },
            },
          },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 10 }, color: "#8a8a8a", maxRotation: 0, autoSkip: true, maxTicksLimit: 12 } },
            y: { grid: { color: "#F0F0F0" }, ticks: { font: { size: 10 }, color: "#8a8a8a" } },
          },
        },
      });
      return () => { if (chartRef.current) chartRef.current.destroy(); };
    }, [series]);

    return (
      <div>
        {unitMixed && <div className="text-[11px] text-warn-text bg-warn-bg rounded-md px-2.5 py-1.5 mb-2 inline-flex items-center gap-1"><Icons.Info size={12} /> KPI's com unidades diferentes selecionados — valores exibidos na escala original de cada um.</div>}
        <div style={{ height }}><canvas ref={canvasRef}></canvas></div>
      </div>
    );
  }

  function KpiPicker({ kpis, blocoFilter, setBlocoFilter, blocks, search, setSearch, selectedIds, toggle }) {
    const list = useMemo(() => {
      const q = (search || "").toLowerCase();
      return kpis.filter((k) => {
        if (blocoFilter && k.bloco !== blocoFilter) return false;
        if (q && !(`${k.kpi} ${k.bloco} ${k.subBloco}`.toLowerCase().includes(q))) return false;
        return true;
      });
    }, [kpis, blocoFilter, search]);

    return (
      <div className="rounded-xl border border-neutral-200 bg-white flex flex-col h-full">
        <div className="p-3 border-b border-neutral-100 space-y-2">
          <div className="text-[13px] font-semibold text-neutral-700">Selecionar KPI's</div>
          <select value={blocoFilter} onChange={(e) => setBlocoFilter(e.target.value)} className="w-full rounded-md border border-neutral-200 px-2 py-1.5 text-xs">
            <option value="">Todos os Blocos</option>
            {blocks.map((b) => <option key={b} value={b}>{b}</option>)}
          </select>
          <div className="relative">
            <Icons.Search size={13} className="absolute left-2 top-1/2 -translate-y-1/2 text-neutral-400" />
            <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Buscar KPI..." className="w-full rounded-md border border-neutral-200 pl-7 pr-2 py-1.5 text-xs" />
          </div>
        </div>
        <div className="flex-1 overflow-y-auto max-h-[420px]">
          {list.map((k) => (
            <label key={k.id} className="flex items-start gap-2 px-3 py-2 hover:bg-neutral-50 cursor-pointer border-b border-neutral-50">
              <input type="checkbox" checked={selectedIds.includes(k.id)} onChange={() => toggle(k.id)} className="mt-0.5 accent-brand" />
              <span className="text-[12px] text-neutral-700 leading-snug">
                <span className="block font-medium">{k.kpi}</span>
                <span className="block text-[10.5px] text-neutral-400">{k.bloco} · {k.subBloco || k.pic}</span>
              </span>
            </label>
          ))}
          {list.length === 0 && <div className="text-center text-xs text-neutral-400 py-6">Nenhum KPI encontrado.</div>}
        </div>
      </div>
    );
  }

  function History({ selectedIso, initialKpiId }) {
    const allKpis = DataService.getKPIs();
    const blocks = DataService.getBlocks();
    const [blocoFilter, setBlocoFilter] = useState("");
    const [search, setSearch] = useState("");
    const [selectedIds, setSelectedIds] = useState(initialKpiId ? [initialKpiId] : []);
    const [period, setPeriod] = useState("30");
    const [dadosOpen, setDadosOpen] = useState(false);

    function toggle(id) {
      setSelectedIds((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : prev.length >= 8 ? prev : [...prev, id]));
    }

    const lastReal = DataService.getMeta().lastRealDate;
    const endIso = selectedIso <= lastReal ? selectedIso : lastReal;
    const bounds = DataService.getDateBounds();
    const p = PERIODS.find((x) => x.key === period);
    const fromIso = p.days ? Calc.addDaysIso(endIso, -(p.days - 1)) : bounds.min;
    const from = fromIso < bounds.min ? bounds.min : fromIso;

    const days = DataService.getDays().filter((d) => d.iso >= from && d.iso <= endIso);
    const selectedKpis = selectedIds.map((id) => DataService.getKPIById(id)).filter(Boolean);
    const series = selectedKpis.map((kpi) => ({ kpi, points: Calc.getDailySeries(kpi, days) }));
    const unitMixed = new Set(selectedKpis.map((k) => k.unit)).size > 1;

    return (
      <div className="p-6 max-w-7xl mx-auto">
        <div className="mb-5">
          <h2 className="text-lg font-bold text-neutral-800">Histórico de KPI's</h2>
          <p className="text-sm text-neutral-500 mt-0.5">Compare a evolução de múltiplos indicadores lado a lado.</p>
        </div>

        <div className="grid grid-cols-1 lg:grid-cols-[280px_1fr] gap-5">
          <KpiPicker kpis={allKpis} blocoFilter={blocoFilter} setBlocoFilter={setBlocoFilter} blocks={blocks} search={search} setSearch={setSearch} selectedIds={selectedIds} toggle={toggle} />

          <div className="space-y-5 min-w-0">
            <div className="flex items-center justify-between flex-wrap gap-2">
              <div className="flex flex-wrap gap-1.5">
                {selectedKpis.map((k, i) => (
                  <span key={k.id} className="inline-flex items-center gap-1.5 rounded-full bg-neutral-100 pl-2.5 pr-1.5 py-1 text-[11px] text-neutral-600">
                    <span className="h-2 w-2 rounded-full" style={{ background: PALETTE[i % PALETTE.length] }}></span>
                    {k.kpi}
                    <button onClick={() => toggle(k.id)} className="text-neutral-400 hover:text-neutral-700"><Icons.X size={11} /></button>
                  </span>
                ))}
                {selectedKpis.length === 0 && <span className="text-xs text-neutral-400">Selecione um ou mais KPI's à esquerda para começar.</span>}
              </div>
              <div className="flex gap-1.5">
                {PERIODS.map((pp) => (
                  <button key={pp.key} onClick={() => setPeriod(pp.key)}
                    className={"px-2.5 py-1 rounded-md text-[11px] font-medium border transition-colors " + (period === pp.key ? "bg-brand text-white border-brand" : "bg-white text-neutral-600 border-neutral-200 hover:bg-neutral-50")}>
                    {pp.label}
                  </button>
                ))}
              </div>
            </div>

            <div className="rounded-xl border border-neutral-200 bg-white p-4">
              <h3 className="text-[13px] font-semibold text-neutral-700 mb-3">Evolução</h3>
              {series.length === 0 ? (
                <div className="h-[220px] flex items-center justify-center text-sm text-neutral-400">Nenhum KPI selecionado.</div>
              ) : (
                <MultiLineChart series={series} unitMixed={unitMixed} />
              )}
            </div>

            <div className="rounded-xl border border-neutral-200 bg-white p-4 overflow-x-auto">
              <h3 className="text-[13px] font-semibold text-neutral-700 mb-3">Comparação</h3>
              {selectedKpis.length === 0 ? (
                <div className="text-sm text-neutral-400 py-4 text-center">Nenhum KPI selecionado.</div>
              ) : (
                <table className="w-full text-[12px]">
                  <thead>
                    <tr className="text-neutral-500 border-b border-neutral-100">
                      <th className="text-left font-medium py-1.5 pr-3">KPI</th>
                      <th className="text-right font-medium py-1.5 px-3">Resultado ({Fmt.formatDateShort(endIso)})</th>
                      <th className="text-right font-medium py-1.5 px-3">Target</th>
                      <th className="text-right font-medium py-1.5 px-3">Média período</th>
                      <th className="text-right font-medium py-1.5 pl-3">Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    {selectedKpis.map((k, i) => {
                      const value = Calc.getValue(k, endIso);
                      const prevValue = Calc.getValue(k, Calc.prevDayIso(endIso));
                      const statusLabel = StatusUtil.computeStatusLabel(k, value, prevValue, endIso);
                      const sc = StatusUtil.STATUS_CLASSES[statusLabel.color];
                      const st = Calc.stats(Calc.getDailySeries(k, days).map((p) => p.value));
                      return (
                        <tr key={k.id} className="border-b border-neutral-50">
                          <td className="py-2 pr-3">
                            <span className="inline-flex items-center gap-1.5">
                              <span className="h-2 w-2 rounded-full shrink-0" style={{ background: PALETTE[i % PALETTE.length] }}></span>
                              <span className="truncate">{k.bloco} — {k.kpi}</span>
                            </span>
                          </td>
                          <td className="text-right px-3 font-semibold text-neutral-700">{Fmt.formatKpiValue(k, value)}</td>
                          <td className="text-right px-3 text-neutral-500">{Fmt.formatTarget(k)}</td>
                          <td className="text-right px-3 text-neutral-500">{Fmt.formatKpiValue(k, st.avg)}</td>
                          <td className="text-right pl-3">
                            <span className={"inline-flex items-center rounded-full px-2 py-0.5 text-[10.5px] font-medium " + sc.bg + " " + sc.text}>{statusLabel.dot} {statusLabel.text}</span>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              )}
            </div>

            <div className="rounded-xl border border-neutral-200 bg-white overflow-hidden">
              <button
                onClick={() => setDadosOpen((o) => !o)}
                className="w-full flex items-center justify-between px-4 py-3 text-left hover:bg-neutral-50 transition-colors"
              >
                <span className="text-[13px] font-semibold text-neutral-700">Dados</span>
                <Icons.ChevronRight size={16} className={"text-neutral-400 transition-transform " + (dadosOpen ? "rotate-90" : "")} />
              </button>
              <div className={"accordion-body" + (dadosOpen ? " open" : "")}>
                <div className="overflow-x-auto px-4 pb-4">
                  {selectedKpis.length === 0 ? (
                    <div className="text-sm text-neutral-400 py-4 text-center">Nenhum KPI selecionado.</div>
                  ) : (
                    <table className="w-full text-[11.5px]">
                      <thead>
                        <tr className="text-neutral-500 border-b border-neutral-100 sticky top-0 bg-white">
                          <th className="text-left font-medium py-1.5 pr-3">Data</th>
                          {selectedKpis.map((k) => <th key={k.id} className="text-right font-medium py-1.5 px-3 whitespace-nowrap">{k.kpi}</th>)}
                        </tr>
                      </thead>
                      <tbody>
                        {days.slice().reverse().map((d) => (
                          <tr key={d.iso} className="border-b border-neutral-50 hover:bg-neutral-50">
                            <td className="py-1.5 pr-3 text-neutral-500">{Fmt.formatDateFull(d.iso)}</td>
                            {selectedKpis.map((k) => (
                              <td key={k.id} className="text-right px-3 tabular-nums">{Fmt.formatKpiValue(k, Calc.getValue(k, d.iso))}</td>
                            ))}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    );
  }

  window.Components = window.Components || {};
  window.Components.History = History;
})();

</script>
<script type="text/babel" data-presets="react">
// components/Settings.js — configurações da aplicação. Tudo aqui é
// funcional (afeta o app em tempo real), nada é apenas decorativo.
(function () {
  const SOURCES = [
    { key: "sheet", label: "Snapshot da planilha", desc: "Fonte ativa hoje — extraída da aba \"Daily\".", active: true },
    { key: "api", label: "API", desc: "Endpoint REST/GraphQL interno.", active: false },
    { key: "sheets", label: "Google Sheets", desc: "Leitura direta via Apps Script / Sheets API.", active: false },
    { key: "excel", label: "Excel", desc: "Importação de arquivo .xlsx.", active: false },
    { key: "db", label: "Banco de dados", desc: "Consulta direta a um banco (SQL).", active: false },
  ];

  function Toggle({ checked, onChange }) {
    return (
      <button
        role="switch"
        aria-checked={checked}
        onClick={() => onChange(!checked)}
        className={"relative inline-flex h-5 w-9 items-center rounded-full transition-colors " + (checked ? "bg-brand" : "bg-neutral-300")}
      >
        <span className={"inline-block h-3.5 w-3.5 transform rounded-full bg-white transition-transform " + (checked ? "translate-x-4.5" : "translate-x-1")} style={{ transform: checked ? "translateX(18px)" : "translateX(3px)" }} />
      </button>
    );
  }

  function Settings({ stableThreshold, onStableThresholdChange, density, onDensityChange, defaultScreen, onDefaultScreenChange }) {
    const meta = DataService.getMeta();

    return (
      <div className="p-6 space-y-6 max-w-3xl mx-auto">
        <div>
          <h2 className="text-lg font-bold text-neutral-800">Configurações</h2>
          <p className="text-sm text-neutral-500 mt-0.5">Preferências de exibição e informações sobre a fonte de dados.</p>
        </div>

        <div className="rounded-xl border border-neutral-200 bg-white p-5 space-y-4">
          <h3 className="text-[13px] font-semibold text-neutral-700">Exibição</h3>

          <div className="flex items-center justify-between">
            <div>
              <div className="text-[13px] text-neutral-700">Densidade da tabela</div>
              <div className="text-[11.5px] text-neutral-400">Compacta encaixa mais linhas na tela.</div>
            </div>
            <div className="flex gap-1.5">
              {[["comfortable", "Confortável"], ["compact", "Compacta"]].map(([k, l]) => (
                <button key={k} onClick={() => onDensityChange(k)}
                  className={"px-2.5 py-1 rounded-md text-[11px] font-medium border transition-colors " + (density === k ? "bg-brand text-white border-brand" : "bg-white text-neutral-600 border-neutral-200 hover:bg-neutral-50")}>
                  {l}
                </button>
              ))}
            </div>
          </div>

          <div className="flex items-center justify-between">
            <div>
              <div className="text-[13px] text-neutral-700">Tela inicial padrão</div>
              <div className="text-[11.5px] text-neutral-400">Tela exibida ao abrir a aplicação.</div>
            </div>
            <select value={defaultScreen} onChange={(e) => onDefaultScreenChange(e.target.value)} className="rounded-md border border-neutral-200 px-2 py-1.5 text-xs">
              <option value="arvore">Árvore de KPI's</option>
              <option value="overview">Visão Geral</option>
              <option value="history">Histórico</option>
            </select>
          </div>

          <div>
            <div className="flex items-center justify-between mb-1">
              <div>
                <div className="text-[13px] text-neutral-700">Margem de estabilidade</div>
                <div className="text-[11.5px] text-neutral-400">Variação tolerada antes de classificar um KPI como "melhorando"/"piorando" em vez de "estável".</div>
              </div>
              <div className="text-[13px] font-semibold text-neutral-700">{stableThreshold.toFixed(1)}×</div>
            </div>
            <input
              type="range" min="0.2" max="3" step="0.1" value={stableThreshold}
              onChange={(e) => onStableThresholdChange(Number(e.target.value))}
              className="w-full accent-brand"
            />
            <div className="flex justify-between text-[10px] text-neutral-400 mt-0.5">
              <span>Mais sensível</span>
              <span>Padrão</span>
              <span>Mais tolerante</span>
            </div>
          </div>
        </div>

        <div className="rounded-xl border border-neutral-200 bg-white p-5 space-y-3">
          <h3 className="text-[13px] font-semibold text-neutral-700">Fonte de dados</h3>
          <p className="text-[12px] text-neutral-500">
            A camada de dados é separada da interface (<code className="text-[11px] bg-neutral-100 px-1 py-0.5 rounded">services/dataService.js</code>),
            então trocar a origem não exige mudanças nas telas.
          </p>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            {SOURCES.map((s) => (
              <div key={s.key} className={"rounded-lg border px-3 py-2.5 " + (s.active ? "border-brand bg-brand-tint/40" : "border-neutral-200 bg-neutral-50")}>
                <div className="flex items-center justify-between">
                  <span className="text-[12.5px] font-medium text-neutral-700">{s.label}</span>
                  {s.active ? (
                    <span className="text-[10px] font-semibold text-brand-dark bg-white border border-brand/40 rounded-full px-1.5 py-0.5">ATIVA</span>
                  ) : (
                    <span className="text-[10px] text-neutral-400">em breve</span>
                  )}
                </div>
                <div className="text-[11px] text-neutral-500 mt-0.5">{s.desc}</div>
              </div>
            ))}
          </div>
          <div className="text-[11.5px] text-neutral-400 pt-1">
            Último dado real: <strong className="text-neutral-600">{Fmt.formatDateFull(meta.lastRealDate)}</strong> · Semanas de referência: <strong className="text-neutral-600">{meta.refWeeks.join(", ")}</strong>
          </div>
        </div>
      </div>
    );
  }

  window.Components = window.Components || {};
  window.Components.Settings = Settings;
})();

</script>
<script type="text/babel" data-presets="react">
// components/App.js — composição raiz: estado global (data selecionada,
// KPI selecionado, tela ativa, preferências) e layout (header + sidebar + conteúdo).
(function () {
  const { useState, useEffect } = React;

  function readLS(key, fallback) {
    try {
      const v = localStorage.getItem(key);
      return v === null ? fallback : JSON.parse(v);
    } catch (e) {
      return fallback;
    }
  }
  function writeLS(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }

  function App() {
    const [defaultScreen, setDefaultScreen] = useState(() => readLS("kpi.defaultScreen", "arvore"));
    const [active, setActive] = useState(defaultScreen);
    const [selectedIso, setSelectedIso] = useState(DataService.getDefaultDate());
    const [selectedKpiId, setSelectedKpiId] = useState(null);
    const [fillDataOpen, setFillDataOpen] = useState(false);
    const [addKpiOpen, setAddKpiOpen] = useState(false);
    const [sidebarCollapsed, setSidebarCollapsed] = useState(() => readLS("kpi.sidebarCollapsed", false));
    const [filters, setFilters] = useState({ search: "", bloco: "", pic: "" });
    const [density, setDensity] = useState(() => readLS("kpi.density", "comfortable"));
    const [stableThreshold, setStableThreshold] = useState(() => {
      const v = readLS("kpi.stableThreshold", 1);
      StatusUtil.setStableThreshold(v);
      return v;
    });

    useEffect(() => writeLS("kpi.sidebarCollapsed", sidebarCollapsed), [sidebarCollapsed]);
    useEffect(() => writeLS("kpi.density", density), [density]);
    useEffect(() => { writeLS("kpi.stableThreshold", stableThreshold); StatusUtil.setStableThreshold(stableThreshold); }, [stableThreshold]);
    useEffect(() => writeLS("kpi.defaultScreen", defaultScreen), [defaultScreen]);

    const selectedKpi = selectedKpiId ? DataService.getKPIById(selectedKpiId) : null;

    // Clicar numa célula de um dia específico abre o popup já com aquele
    // dia como referência (o iso é opcional — cliques em colunas que não
    // são um dia único, como Target ou semanas, só trocam o KPI).
    function selectKpi(kpiId, iso) {
      if (iso) setSelectedIso(iso);
      setSelectedKpiId(kpiId);
    }

    return (
      <div className="min-h-screen">
        <Components.Header selectedIso={selectedIso} onDateChange={setSelectedIso} onOpenFillData={() => setFillDataOpen(true)} onOpenAddKpi={() => setAddKpiOpen(true)} />
        <Components.Sidebar
          active={active}
          onNavigate={setActive}
          collapsed={sidebarCollapsed}
          onToggleCollapse={() => setSidebarCollapsed((c) => !c)}
        />

        <main
          className={"pt-14 transition-all duration-200 " + (sidebarCollapsed ? "pl-[64px]" : "pl-[196px]")}
          style={{ minHeight: "100vh" }}
        >
          {active === "arvore" && (
            <div style={{ height: "calc(100vh - 56px)" }}>
              <Components.KPITable
                selectedIso={selectedIso}
                onDateChange={setSelectedIso}
                selectedKpiId={selectedKpiId}
                onSelectKpi={selectKpi}
                filters={filters}
                onFiltersChange={setFilters}
                density={density}
              />
            </div>
          )}

          {active === "overview" && (
            <div className="overflow-y-auto" style={{ height: "calc(100vh - 56px)" }}>
              <Components.Overview selectedIso={selectedIso} onSelectKpi={setSelectedKpiId} />
            </div>
          )}

          {active === "history" && (
            <div className="overflow-y-auto" style={{ height: "calc(100vh - 56px)" }}>
              <Components.History selectedIso={selectedIso} initialKpiId={selectedKpiId} />
            </div>
          )}

          {active === "settings" && (
            <div className="overflow-y-auto" style={{ height: "calc(100vh - 56px)" }}>
              <Components.Settings
                stableThreshold={stableThreshold}
                onStableThresholdChange={setStableThreshold}
                density={density}
                onDensityChange={setDensity}
                defaultScreen={defaultScreen}
                onDefaultScreenChange={setDefaultScreen}
              />
            </div>
          )}
        </main>

        {selectedKpi && (
          <Components.KPIModal kpi={selectedKpi} selectedIso={selectedIso} onClose={() => setSelectedKpiId(null)} />
        )}

        {fillDataOpen && (
          <Components.FillDataModal onClose={() => setFillDataOpen(false)} />
        )}

        {addKpiOpen && (
          <Components.AddKpiModal onClose={() => setAddKpiOpen(false)} />
        )}
      </div>
    );
  }

  window.Components = window.Components || {};
  window.Components.App = App;
})();

</script>

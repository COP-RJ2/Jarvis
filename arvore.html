<style>
/* Estilos que o Tailwind (via CDN, sem build) não cobre bem: sticky columns
   com offsets dinâmicos, scrollbars finas e pequenas animações. */

* { box-sizing: border-box; }
html, body { height: 100%; }
body { font-size: 14px; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #d4d4d4; border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: #b8b8b8; }

/* ---------- Tabela de KPIs: colunas congeladas ---------- */
.kpi-grid { border-collapse: separate; border-spacing: 0; table-layout: fixed; }
.kpi-grid td, .kpi-grid th { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

.kpi-grid thead th {
  position: sticky;
  top: 0;
  z-index: 30;
}

.kpi-grid .frozen-col {
  position: sticky;
  z-index: 15;
  /* Sem "background" aqui: cada célula já define sua própria cor via
     classe Tailwind (bg-brand, bg-white, bg-ok-bg…). Uma cor genérica
     nesta regra entra em disputa de especificidade com o CDN do
     Tailwind (que injeta seu <style> dinamicamente) e pode "vencer" de
     forma não-determinística, apagando o laranja do cabeçalho. */
}
.kpi-grid thead th.frozen-col { z-index: 40; }

/* Mais específico que ".bg-white" de propósito, pra sempre vencer a
   disputa (isso aqui É uma sobrescrita deliberada, ao contrário da regra
   genérica acima). */
.kpi-grid tbody tr:hover td.frozen-col.bg-white { background-color: #FFF7F3; }

.kpi-cell {
  cursor: pointer;
  transition: filter .12s ease, transform .06s ease;
}
/* Feedback discreto: só ajusta o brilho/saturação da própria cor da célula —
   nunca troca a cor, nunca desenha borda/quadrado. */
.kpi-cell:hover {
  filter: brightness(0.97);
}
.kpi-cell:active { transform: scale(0.98); }
.kpi-cell.is-selected {
  filter: brightness(0.92) saturate(1.08);
  font-weight: 600;
}

/* Linha vertical fina que marca a coluna do dia ATUAL (data real do
   sistema, não a data selecionada) — sem quadrados nem bordas por célula. */
.today-line {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--today-line-color, #EE4D2D);
  pointer-events: none;
  z-index: 12;
}

/* Divisória discreta entre meses na linha do tempo */
.kpi-grid td.month-start, .kpi-grid th.month-start { border-left: 1.5px solid #D8D8D8; }

.bloco-vertical {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
}

tr.bloco-start-row td { border-top: 2px solid #C8401F; }

/* ---------- Painel lateral ---------- */
.slide-panel-enter {
  transform: translateX(100%);
}
.slide-panel-active {
  transform: translateX(0);
  transition: transform .22s cubic-bezier(.32,.72,0,1);
}
.overlay-fade {
  transition: opacity .18s ease;
}

/* ---------- Barra de progresso "Performance por Bloco" ---------- */
.bar-track { background: #EFEFEF; border-radius: 999px; overflow: hidden; }
.bar-fill { transition: width .5s cubic-bezier(.22,.9,.3,1); border-radius: 999px; }

/* ---------- Tooltip simples ---------- */
[data-tip] { position: relative; }
[data-tip]:hover::after {
  content: attr(data-tip);
  position: absolute;
  left: 50%;
  bottom: calc(100% + 6px);
  transform: translateX(-50%);
  background: #242424;
  color: #fff;
  font-size: 11px;
  line-height: 1.3;
  padding: 5px 8px;
  border-radius: 5px;
  white-space: nowrap;
  z-index: 60;
  pointer-events: none;
  box-shadow: 0 4px 12px rgba(0,0,0,.18);
}

/* ---------- Accordion (ex.: "Dados" no Histórico) ---------- */
.accordion-body {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows .25s ease;
}
.accordion-body.open { grid-template-rows: 1fr; }
.accordion-body > div { overflow: hidden; min-height: 0; }

/* ---------- Fade/scale genérico para modais e dropdowns ---------- */
@keyframes popIn {
  from { opacity: 0; transform: translateY(-4px) scale(.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.anim-pop { animation: popIn .14s ease-out; }

@keyframes toastIn {
  from { opacity: 0; transform: translateX(16px); }
  to { opacity: 1; transform: translateX(0); }
}
.anim-toast { animation: toastIn .18s ease-out; }

.scroll-shadow-x {
  background:
    linear-gradient(to right, white 0%, rgba(255,255,255,0) 4%),
    linear-gradient(to left, white 0%, rgba(255,255,255,0) 4%);
}

</style>

<!-- Camada de dados — AO VIVO, não mais snapshot estático (pedido do
     Roberto em 2026-08-14): busca /api/overview?arvore=1 antes do resto da
     página carregar (XHR síncrono — ver comentário no código-fonte).
     ?arvore=1 tem Cache-Control de 5min (poupa CPU nas navegações normais)
     — mas isso escondia o dado recém-salvo logo após "Preencher dados"
     recarregar a página (achado pelo Roberto em 2026-08-17: reload caía
     dentro da janela de cache do CDN e mostrava o valor antigo). Se a URL
     tiver ?_fresh=..., força bypass do cache só nesse load específico. -->
<script>
(function () {
  var xhr = new XMLHttpRequest();
  var fresh = new URLSearchParams(window.location.search).get('_fresh');
  var url = '/api/overview?arvore=1' + (fresh ? '&_fresh=' + encodeURIComponent(fresh) : '');
  xhr.open('GET', url, false);
  xhr.send(null);
  if (xhr.status !== 200) throw new Error('Falha ao carregar a árvore (HTTP ' + xhr.status + ')');
  var j = JSON.parse(xhr.responseText);
  if (!j.ok) throw new Error(j.erro || 'Falha ao carregar a árvore');
  // O backend chama de "obs" (Observação da planilha); o bundle espera
  // "insights" (mesmo shape: {isoDate: texto}) — só o nome do campo muda.
  (j.kpis || []).forEach(function (k) { k.insights = k.obs; });
  window.KPI_DATA = j;
})();
</script>

<!-- Utils -->
<script type="text/babel" data-presets="react">
// utils/formatting.js — formatação de números, datas e rótulos.
// Não conhece nada de UI; só transforma dados em texto.
(function () {
  function round(n, decimals) {
    const f = Math.pow(10, decimals);
    return Math.round((n + Number.EPSILON) * f) / f;
  }

  function formatNumber(value, decimals) {
    if (value === null || value === undefined || !isFinite(value)) return "—";
    return value.toLocaleString("pt-BR", {
      minimumFractionDigits: decimals,
      maximumFractionDigits: decimals,
    });
  }

  // Valor bruto (fração p/ percentuais) -> texto de exibição, respeitando a unidade do KPI.
  function formatKpiValue(kpi, raw) {
    if (raw === null || raw === undefined || !isFinite(raw)) return "—";
    if (kpi.unit === "percent") {
      return formatNumber(round(raw * 100, 2), Number.isInteger(round(raw * 100, 2)) ? 0 : 2) + "%";
    }
    const abs = Math.abs(raw);
    if (Number.isInteger(raw)) return formatNumber(raw, 0);
    if (abs < 10) return formatNumber(round(raw, 2), 2);
    return formatNumber(round(raw, 1), 1);
  }

  function formatTarget(kpi) {
    if (kpi.target === null || kpi.target === undefined) return "—";
    return formatKpiValue(kpi, kpi.target);
  }

  // Diferença já calculada (mesma escala bruta do KPI) -> "p.p." para % ou valor puro.
  function formatDelta(kpi, delta, opts) {
    opts = opts || {};
    if (delta === null || delta === undefined || !isFinite(delta)) return "—";
    const arrow = delta > 0.0000001 ? "↑" : delta < -0.0000001 ? "↓" : "→";
    let magnitude;
    if (kpi.unit === "percent") {
      magnitude = formatNumber(round(Math.abs(delta) * 100, 2), 2) + " p.p.";
    } else {
      magnitude = formatKpiValue(kpi, Math.abs(delta));
    }
    return (opts.arrowOnly ? arrow : arrow + " " + magnitude);
  }

  function formatDateShort(iso) {
    if (!iso) return "";
    return iso.slice(8, 10) + "/" + iso.slice(5, 7);
  }

  function formatDateFull(iso) {
    if (!iso) return "";
    return iso.slice(8, 10) + "/" + iso.slice(5, 7) + "/" + iso.slice(0, 4);
  }

  function formatDateHeader(iso) {
    return { day: formatDateShort(iso) };
  }

  const MONTHS_PT = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

  // "2026-07" -> "Julho 2026"
  function formatMonthLabel(monthKey) {
    if (!monthKey) return "";
    const [y, m] = monthKey.split("-").map(Number);
    return MONTHS_PT[m - 1] + " " + y;
  }

  function formatUpdatedAt(date) {
    const d = date || new Date();
    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");
    return hh + ":" + mm;
  }

  window.Fmt = {
    round,
    formatNumber,
    formatKpiValue,
    formatTarget,
    formatDelta,
    formatDateShort,
    formatDateFull,
    formatDateHeader,
    formatMonthLabel,
    formatUpdatedAt,
  };
})();

</script>
<script type="text/babel" data-presets="react">
// utils/status.js — decide o status de um KPI comparando o valor com o
// target E a tendência (respeitando a polaridade: menor-é-melhor,
// maior-é-melhor, ou "quanto mais perto de zero, melhor"). Única camada de
// cálculo de status do dashboard — ver computeStatusLabel().
(function () {
  const STATUS_CLASSES = {
    ok: { bg: "bg-ok-bg", text: "text-ok-text", ring: "ring-ok" },
    warn: { bg: "bg-warn-bg", text: "text-warn-text", ring: "ring-warn" },
    bad: { bg: "bg-bad-bg", text: "text-bad-text", ring: "ring-bad" },
    na: { bg: "bg-na-bg", text: "text-na-text", ring: "ring-na" },
  };

  const TREND = {
    UP: { key: "up", label: "Subindo", arrow: "↑" },
    DOWN: { key: "down", label: "Caindo", arrow: "↓" },
    STABLE: { key: "stable", label: "Estável", arrow: "→" },
    NA: { key: "na", label: "—", arrow: "" },
  };

  // stable_threshold: margem (multiplicador) que define quando uma variação
  // é "estável" em vez de subindo/caindo. Ajustável em Configurações.
  let STABLE_THRESHOLD_MULT = 1;
  function setStableThreshold(v) { STABLE_THRESHOLD_MULT = Math.max(0.2, Math.min(5, v)); }
  function getStableThreshold() { return STABLE_THRESHOLD_MULT; }

  // Tendência: direção bruta do valor (não leva em conta se é bom ou ruim —
  // isso é decidido separadamente pela polaridade/direção do KPI).
  function computeTrend(kpi, delta) {
    if (delta === null || delta === undefined || !isFinite(delta)) return TREND.NA;
    let base;
    if (kpi.unit === "percent") {
      base = 0.001; // 0,1 p.p.
    } else {
      const scale = Math.max(Math.abs(kpi.target) || 0, 1);
      base = scale * 0.01;
    }
    const threshold = base * STABLE_THRESHOLD_MULT;
    if (delta > threshold) return TREND.UP;
    if (delta < -threshold) return TREND.DOWN;
    return TREND.STABLE;
  }

  // "Dentro do Target" ou "Fora do Target" — binário, sem margem de tolerância.
  function isWithinTarget(kpi, value) {
    if (value === null || value === undefined || !isFinite(value)) return null;
    if (kpi.target === null || kpi.target === undefined) return null;
    if (kpi.polarity === "near_zero") return Math.abs(value) <= Math.abs(kpi.target);
    // "band100" (pedido do Roberto em 2026-08-28, KPI "(%) Desvio de
    // Forecast"): valor é uma razão em torno de 100% (1.0), não um desvio
    // em torno de zero — dentro do target = |valor - 1| <= tolerância.
    if (kpi.polarity === "band100") return Math.abs(value - 1) <= Math.abs(kpi.target);
    if (kpi.polarity === "lower_better") return value <= kpi.target;
    return value >= kpi.target;
  }

  // Os 5 status permitidos (e só estes) — textos exatos exigidos pelo
  // projeto. Esta é a ÚNICA camada de cálculo do status; todo o dashboard
  // (tabela, popup, Visão Geral, turnos, histórico, insights) usa esta
  // mesma função pra nunca divergir.
  const STATUS5 = {
    IN_TARGET: { key: "in_target", text: "Dentro do Target", dot: "🟢", color: "ok" },
    IN_TARGET_STABLE: { key: "in_target_stable", text: "Dentro do target estável", dot: "🟢", color: "ok" },
    IN_TARGET_WORSENING: { key: "in_target_worsening", text: "Dentro do target piorando", dot: "🟡", color: "warn" },
    OUT_TARGET_IMPROVING: { key: "out_target_improving", text: "Fora do target melhorando", dot: "🟡", color: "warn" },
    OUT_TARGET_WORSENING: { key: "out_target_worsening", text: "Fora do target piorando", dot: "🔴", color: "bad" },
    NA: { key: "na", text: "Sem dado", dot: "⚪", color: "na" },
  };

  // >24 horas / >48 horas / >72 horas / >10 dias (Stuck) não têm target
  // próprio na planilha — herdam o status de "%> 24 horas" do mesmo grupo
  // (bloco/pic/sub bloco), quando essa métrica existir ali. Pedido do
  // Roberto em 2026-08-18: "ficam fora do target se o KPI %> 24 horas
  // estiver acima do target dele". Só o Status muda — o valor exibido
  // continua sendo a contagem real, e a tendência (melhorando/piorando)
  // continua calculada em cima do valor/polaridade do próprio KPI.
  const TARGET_LINKED_KPIS = new Set([">24 horas", ">48 horas", ">72 horas", ">10 dias"]);
  const TARGET_LINK_SOURCE = "%> 24 horas";
  function findLinkedTargetKpi(kpi) {
    if (!TARGET_LINKED_KPIS.has(kpi.kpi)) return null;
    if (typeof DataService === "undefined" || !DataService.getKPIs) return null;
    return DataService.getKPIs().find((k) =>
      k.kpi === TARGET_LINK_SOURCE && k.bloco === kpi.bloco && k.pic === kpi.pic && k.subBloco === kpi.subBloco
    ) || null;
  }

  // value = resultado a avaliar; compareValue = resultado do período de
  // comparação (ex.: D-1), usado só para achar a tendência. Sem compareValue
  // disponível, a tendência é tratada como estável (não inventa "melhora"/"piora").
  // date (opcional) = chave da coluna (iso ou "W..") sendo avaliada — só é
  // usado pra buscar o valor do KPI vinculado (ver TARGET_LINKED_KPIS acima).
  function computeStatusLabel(kpi, value, compareValue, date) {
    const linked = date !== undefined ? findLinkedTargetKpi(kpi) : null;
    const within = linked && typeof Calc !== "undefined"
      ? isWithinTarget(linked, Calc.getValueForKey(linked, date))
      : isWithinTarget(kpi, value);
    if (within === null) return STATUS5.NA;

    let trendState = "stable";
    if (compareValue !== null && compareValue !== undefined && isFinite(compareValue)) {
      const delta = value - compareValue;
      const trend = computeTrend(kpi, delta);
      if (trend.key !== "stable") {
        if (kpi.polarity === "near_zero") {
          trendState = Math.abs(value) < Math.abs(compareValue) ? "improving" : "worsening";
        } else if (kpi.polarity === "band100") {
          trendState = Math.abs(value - 1) < Math.abs(compareValue - 1) ? "improving" : "worsening";
        } else {
          const goingUp = trend.key === "up";
          const improving = kpi.polarity === "lower_better" ? !goingUp : goingUp;
          trendState = improving ? "improving" : "worsening";
        }
      }
    }

    if (within) {
      if (trendState === "stable") return STATUS5.IN_TARGET_STABLE;
      if (trendState === "worsening") return STATUS5.IN_TARGET_WORSENING;
      return STATUS5.IN_TARGET; // melhorando (ou sem comparação) — sem rótulo próprio, fica "Dentro do Target"
    }
    // fora do target: a árvore de decisão só define melhorando/piorando;
    // "fora e estável" (sem progresso) é tratado como piorando.
    return trendState === "improving" ? STATUS5.OUT_TARGET_IMPROVING : STATUS5.OUT_TARGET_WORSENING;
  }

  window.StatusUtil = {
    STATUS_CLASSES,
    TREND, computeTrend, setStableThreshold, getStableThreshold,
    STATUS5, isWithinTarget, computeStatusLabel,
  };
})();

</script>
<script type="text/babel" data-presets="react">
// utils/calculations.js — variações, insights automáticos e estatísticas
// de histórico. Tudo derivado dos dados; nada de texto fixo/aleatório.
(function () {
  function getValue(kpi, colKey) {
    if (!kpi || !kpi.valores) return null;
    const v = kpi.valores[colKey];
    return v === undefined ? null : v;
  }

  function addDaysIso(iso, days) {
    const [y, m, d] = iso.split("-").map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    dt.setUTCDate(dt.getUTCDate() + days);
    return dt.toISOString().slice(0, 10);
  }

  function prevDayIso(iso) {
    return addDaysIso(iso, -1);
  }

  // "W32" -> "W31" (numeração das semanas é sequencial nos dados)
  function prevWeekLabel(label) {
    const n = parseInt(String(label).replace(/^W/, ""), 10);
    if (!isFinite(n) || n <= 2) return null;
    return "W" + (n - 1);
  }

  // dada uma chave de coluna (dia "2026-08-06" ou semana "W32"), acha a
  // chave do período de comparação imediatamente anterior — usada pra
  // calcular a tendência de qualquer célula da tabela com a mesma regra
  // usada no restante do dashboard.
  function prevPeriodKey(colKey) {
    return colKey.indexOf("-") !== -1 ? prevDayIso(colKey) : prevWeekLabel(colKey);
  }

  // Data real de hoje (relógio do dispositivo), no formato YYYY-MM-DD —
  // usada só para o indicador visual do "dia atual", nunca para a análise
  // (que segue a data selecionada pelo usuário).
  function getTodayIso() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  // Combina os 3 filtros da Visão Geral (Data/Semana/Mês) por interseção —
  // cada dimensão vazia/nula significa "sem restrição nessa dimensão".
  // Ex.: só Semana=W32 -> todos os dias de W32; Data=13/08 + Semana=W32 ->
  // só 13/08 (a interseção dá só esse dia, já que ele pertence a W32).
  function getFilteredDays(days, filters) {
    filters = filters || {};
    let result = days;
    if (filters.months && filters.months.length) {
      const set = new Set(filters.months);
      result = result.filter((d) => set.has(d.iso.slice(0, 7)));
    }
    if (filters.weeks && filters.weeks.length) {
      const set = new Set(filters.weeks);
      result = result.filter((d) => set.has(d.wk));
    }
    if (filters.date) {
      result = result.filter((d) => d.iso === filters.date);
    }
    return result;
  }

  // Insights automáticos da Visão Geral: resume o preenchimento por bloco
  // e o status geral do período — só com base no que foi calculado em
  // DataService.computeOverviewStats, nunca texto fixo.
  function generateOverviewInsights(stats) {
    const insights = [];
    if (!stats.byBloco.length) return insights;

    const withData = stats.byBloco.filter((b) => b.pct !== null);
    if (withData.length) {
      const best = withData.reduce((a, b) => (b.pct > a.pct ? b : a));
      const worst = withData.reduce((a, b) => (b.pct < a.pct ? b : a));
      insights.push({ icon: "check", text: `${best.bloco} é o bloco com maior preenchimento de dados (${best.pct}%).` });
      if (worst.bloco !== best.bloco) {
        const icon = worst.pct < 50 ? "alert" : "warn";
        insights.push({ icon, text: `${worst.bloco} tem o menor preenchimento de dados (${worst.pct}%).` });
      }
    }

    const totalAvaliados = stats.ok + stats.warn + stats.bad;
    if (totalAvaliados > 0) {
      insights.push({ icon: "check", text: `${stats.ok} de ${totalAvaliados} KPIs avaliados estão dentro do Target.` });
      if (stats.bad > 0) {
        insights.push({ icon: "alert", text: `${stats.bad} KPI${stats.bad > 1 ? "s estão" : " está"} fora do Target e piorando.` });
      }
    }

    if (stats.periodDays > 1) {
      insights.push({ icon: "dash", text: `Período analisado: ${stats.periodDays} dias (referência de status: ${Fmt.formatDateFull(stats.refIso)}).` });
    }

    return insights;
  }

  // Janela padrão de exibição da tabela: mês da data selecionada + mês
  // anterior. Não apaga histórico — é só o recorte inicial (o filtro de
  // Mês/Semana dá acesso a qualquer período existente).
  function getDefaultWindowDays(days, selectedIso) {
    const [prevMonth, curMonth] = getDefaultMonths(selectedIso);
    return days.filter((d) => {
      const dm = d.iso.slice(0, 7);
      return dm === curMonth || dm === prevMonth;
    });
  }

  // [mesAnteriorKey, mesAtualKey] em ordem cronológica, relativos à data selecionada.
  function getDefaultMonths(selectedIso) {
    const curMonth = selectedIso.slice(0, 7);
    const [y, m] = curMonth.split("-").map(Number);
    const prev = new Date(Date.UTC(y, m - 2, 1));
    const prevMonth = prev.getUTCFullYear() + "-" + String(prev.getUTCMonth() + 1).padStart(2, "0");
    return [prevMonth, curMonth];
  }

  // delta bruto (mesma escala do valor); null se algum lado faltar
  function delta(current, compare) {
    if (current === null || current === undefined || compare === null || compare === undefined) return null;
    if (!isFinite(current) || !isFinite(compare)) return null;
    return current - compare;
  }

  // true = melhorou, false = piorou, null = neutro/indefinido — depende da polaridade do KPI
  function isImprovement(kpi, d) {
    if (d === null || d === undefined) return null;
    if (Math.abs(d) < 1e-9) return null;
    if (kpi.polarity === "lower_better") return d < 0;
    if (kpi.polarity === "near_zero") return false; // tratado à parte (usa abs)
    return d > 0; // higher_better
  }

  function getTurnoEntries(kpi, colKey, DataService) {
    if (!kpi.turnoRefs) return [];
    return Object.keys(kpi.turnoRefs)
      .sort()
      .map((tKey) => {
        const sibling = DataService.getKPIById(kpi.turnoRefs[tKey]);
        const value = sibling ? getValue(sibling, colKey) : null;
        const prevValue = sibling ? getValue(sibling, prevDayIso(colKey)) : null;
        const statusLabel = sibling ? StatusUtil.computeStatusLabel(sibling, value, prevValue, colKey) : StatusUtil.STATUS5.NA;
        return { turno: tKey, kpi: sibling, value, statusLabel };
      });
  }

  // conta quantos períodos diários consecutivos (terminando no mais recente)
  // se movem na mesma direção de melhora/piora — usado no insight de evolução
  function computeTrendStreak(kpi, trailingValues) {
    const nums = (trailingValues || []).filter((v) => v !== null && v !== undefined);
    if (nums.length < 3) return null;
    let dir = null;
    let deltaCount = 0;
    for (let i = nums.length - 1; i > 0; i--) {
      const d = nums[i] - nums[i - 1];
      if (Math.abs(d) < 1e-9) break;
      const imp = isImprovement(kpi, d);
      if (imp === null) break;
      if (dir === null) dir = imp;
      else if (imp !== dir) break;
      deltaCount++;
    }
    if (deltaCount >= 2) return { improved: dir, periods: deltaCount + 1 };
    return null;
  }

  // ---------------------------------------------------------------------
  // Insights automáticos ("COP Boy") — gerados a partir dos dados, nunca
  // texto fixo/aleatório. Complementam (não substituem) os insights
  // oficiais preenchidos na fonte de dados (kpi.insight).
  // ---------------------------------------------------------------------
  function generateInsights(kpi, ctx) {
    const insights = [];
    const { statusLabel, value, deltaD1, deltaRefWeek, refWeekLabel, turnoEntries, trailingValues } = ctx;

    const gapText = value !== null && value !== undefined && kpi.target !== null && kpi.target !== undefined
      ? (() => {
          const gap = value - kpi.target;
          const dirWord = gap > 0 ? "acima" : "abaixo";
          const mag = Fmt.formatDelta(kpi, Math.abs(gap)).replace(/^[↑↓→]\s*/, "");
          return `${mag} ${dirWord} do Target`;
        })()
      : null;

    switch (statusLabel.key) {
      case "in_target":
        insights.push({ icon: "check", text: "O resultado está dentro do Target." });
        break;
      case "in_target_stable":
        insights.push({ icon: "check", text: "O resultado está dentro do Target e estável em relação ao período anterior." });
        break;
      case "in_target_worsening":
        insights.push({ icon: "warn", text: "O resultado está dentro do Target, mas a tendência é de piora." });
        break;
      case "out_target_improving":
        insights.push({ icon: "up", text: gapText ? `O resultado está ${gapText}, porém melhorando e se aproximando da meta.` : "O resultado está fora do Target, porém melhorando." });
        break;
      case "out_target_worsening":
        insights.push({ icon: "alert", text: gapText ? `O resultado está ${gapText} e piorando.` : "O resultado está fora do Target e piorando." });
        break;
      default:
        insights.push({ icon: "dash", text: "Não há dado suficiente para avaliar este indicador na data selecionada." });
    }

    if (deltaD1 !== null && deltaD1 !== undefined) {
      const improved = isImprovement(kpi, deltaD1);
      const mag = Fmt.formatDelta(kpi, Math.abs(deltaD1), { arrowOnly: false }).replace(/^[↑↓→]\s*/, "");
      if (improved === true) insights.push({ icon: "up", text: `O indicador apresentou melhora de ${mag} em relação ao D-1.` });
      else if (improved === false) insights.push({ icon: "down", text: `O indicador apresentou piora de ${mag} em relação ao D-1.` });
    }

    if (deltaRefWeek !== null && deltaRefWeek !== undefined) {
      const improved = isImprovement(kpi, deltaRefWeek);
      if (improved === true) insights.push({ icon: "up", text: `O indicador apresentou melhora em relação à semana ${refWeekLabel || "anterior"}.` });
      else if (improved === false) insights.push({ icon: "down", text: `O indicador apresentou piora em relação à semana ${refWeekLabel || "anterior"}.` });
    }

    const streak = computeTrendStreak(kpi, trailingValues);
    if (streak) {
      insights.push({
        icon: streak.improved ? "up" : "down",
        text: `O indicador apresentou ${streak.improved ? "melhora" : "piora"} nos últimos ${streak.periods} períodos.`,
      });
    }

    if (turnoEntries && turnoEntries.length) {
      const withData = turnoEntries.filter((t) => t.value !== null);
      const above = withData.filter((t) => t.statusLabel.key.indexOf("out_target") === 0);
      const ok = withData.filter((t) => t.statusLabel.key.indexOf("in_target") === 0);
      if (above.length === 1 && ok.length === withData.length - 1 && withData.length > 1) {
        insights.push({ icon: "alert", text: `${above[0].turno} é o único turno fora do target.` });
      } else if (above.length > 0 && above.length < withData.length) {
        insights.push({ icon: "alert", text: `${above.map((t) => t.turno).join(", ")} ${above.length > 1 ? "estão" : "está"} fora do target.` });
      } else if (above.length === 0 && withData.length > 0) {
        insights.push({ icon: "check", text: "Todos os turnos estão dentro do target." });
      }

      if (withData.length > 1) {
        const worst = withData.reduce((acc, t) => {
          const d = kpi.polarity === "lower_better" ? t.value : -t.value;
          const accD = kpi.polarity === "lower_better" ? acc.value : -acc.value;
          return d > accD ? t : acc;
        });
        if (worst.statusLabel.key.indexOf("in_target") !== 0) {
          insights.push({ icon: "target", text: `O maior desvio está concentrado no turno ${worst.turno}.` });
        }
      }
    }

    return insights.slice(0, 6);
  }

  // ---------------------------------------------------------------------
  // Séries para gráficos / histórico
  // ---------------------------------------------------------------------
  // Consolida os dias de um período (semana ou mês) segundo a "Memória de
  // Cálculo" do KPI (kpi.memoriaCalculo, vinda da planilha "Target dos
  // indicadores do site" — pedido do Roberto em 2026-08-24). `periodDays` =
  // array de objetos de dia (mesmo shape de DataService.getDays()) já
  // filtrado pro período. Sem memoriaCalculo -> null (quem chamou cai pro
  // comportamento de sempre: valor cru do backend na semana, média simples
  // no mês) — nunca inventa consolidado pra KPI sem essa definição.
  // Tolera até TOLERANCIA_DIAS_FALTANDO dias sem valor no período (pedido
  // do Roberto em 2026-08-29: semanas como a W33/W34 tinham só 1-2 dias
  // sem entrada na planilha — ex. Produtividade Planejada sem 12/08 e
  // 13/08 na W33 — e ficavam eternamente em "—" mesmo com o resto da
  // semana preenchido; calcula com os dias que existem em vez de exigir
  // 100%). Acima da tolerância -> null, quem chamou cai pro fallback (v2,
  // pedido do Roberto em 2026-08-27: evita mascarar semana MUITO
  // incompleta como se fosse fechada).
  // Primeiro dia (ISO) com valor gravado pro KPI — usado por aggregatePeriod
  // pra saber onde a série dele realmente começa (ver comentário abaixo).
  const TOLERANCIA_DIAS_FALTANDO = 2;
  function primeiraDataComValor(kpi) {
    const isoKeys = Object.keys(kpi.valores || {}).filter((k) => /^\d{4}-\d{2}-\d{2}$/.test(k));
    return isoKeys.length ? isoKeys.sort()[0] : null;
  }

  function aggregatePeriod(kpi, periodDays) {
    const tipo = kpi.memoriaCalculo;
    if (!tipo || !periodDays || !periodDays.length) return null;

    // Semana/mês estruturalmente parcial (pedido do Roberto em 2026-08-28):
    // a série de um KPI pode começar no meio de um período civil (ex.:
    // primeira semana rastreada com só 4 dos 7 dias) — dia ANTERIOR ao
    // início da série nunca vai ganhar valor, então não conta como "dia
    // esperado" pra completude (senão esse período fica em fallback pra
    // sempre por uma expectativa que nunca vai ser atingida). Dia faltando
    // DEPOIS que a série já começou continua contando normalmente.
    const primeiraData = primeiraDataComValor(kpi);
    const periodoNaSerie = primeiraData ? periodDays.filter((d) => d.iso >= primeiraData) : periodDays;
    if (!periodoNaSerie.length) return null;

    if (tipo === "formula_diff_pct") {
      if (!kpi.aggRefs || typeof DataService === "undefined") return null;
      const num = DataService.getKPIById(kpi.aggRefs.numeradorId);
      const den = DataService.getKPIById(kpi.aggRefs.denominadorId);
      if (!num || !den) return null;
      // Dias com numerador E denominador presentes — tolera até
      // TOLERANCIA_DIAS_FALTANDO dias sem os dois (soma só os presentes).
      const presentesFormula = periodoNaSerie.filter((d) => {
        const vn = getValue(num, d.iso), vd = getValue(den, d.iso);
        return vn !== null && vn !== undefined && vd !== null && vd !== undefined;
      });
      if (periodoNaSerie.length - presentesFormula.length > TOLERANCIA_DIAS_FALTANDO || !presentesFormula.length) return null;
      let somaNum = 0, somaDen = 0;
      presentesFormula.forEach((d) => { somaNum += getValue(num, d.iso); somaDen += getValue(den, d.iso); });
      // SEERRO(...,"") do original: denominador zerado vira vazio, nunca divide por zero.
      if (somaDen === 0) return null;
      return (somaNum - somaDen) / somaDen;
    }

    const dias = tipo === "media_sem_domingo" ? periodoNaSerie.filter((d) => d.wd !== "Dom") : periodoNaSerie;
    if (!dias.length) return null;
    const presentes = dias.map((d) => getValue(kpi, d.iso)).filter((v) => v !== null && v !== undefined && isFinite(v));
    if (dias.length - presentes.length > TOLERANCIA_DIAS_FALTANDO || !presentes.length) return null;
    const nums = presentes;

    if (tipo === "soma") return nums.reduce((a, b) => a + b, 0);
    if (tipo === "maximo") return Math.max(...nums);
    return nums.reduce((a, b) => a + b, 0) / nums.length; // "media" e "media_sem_domingo"
  }

  // Valor consolidado de um período (semana OU mês): calcula pela Memória
  // de Cálculo quando o período está completo; senão (sem memoriaCalculo,
  // período incompleto, ou erro no cálculo — isolado aqui pra não derrubar
  // os outros KPIs) cai pro valor pronto que já veio do backend pra esse
  // período (a linha-resumo "Wxx" da planilha, ou o mês, se existir) —
  // nunca inventa um consolidado só de dias parciais.
  function getPeriodValue(kpi, periodLabel, periodDays) {
    let value = null;
    if (kpi.memoriaCalculo) {
      try {
        value = aggregatePeriod(kpi, periodDays);
      } catch (err) {
        console.warn("[arvore] falha ao agregar " + periodLabel + " pro KPI " + kpi.bloco + "|" + kpi.subBloco + "|" + kpi.kpi, err);
        value = null;
      }
    }
    if (value === null || value === undefined) value = getValue(kpi, periodLabel);
    return value;
  }

  // Resolve os dias de uma semana via DataService.getDays()/d.wk — o mesmo
  // agrupamento dia->semana que a coluna "Semana" da planilha árvore_pulso
  // já materializa linha a linha (nunca calculado por calendário ISO aqui).
  function getWeekValue(kpi, week) {
    if (!week) return null;
    const allDays = typeof DataService !== "undefined" ? DataService.getDays() : [];
    const diasSemana = allDays.filter((d) => d.wk === week.label);
    return getPeriodValue(kpi, week.label, diasSemana);
  }

  function getWeeklySeries(kpi, weeks) {
    return weeks.map((w) => ({ key: w.label, label: w.label, value: getWeekValue(kpi, w), isWeek: true }));
  }

  function getDailySeries(kpi, days) {
    return days.map((d) => ({ key: d.iso, label: Fmt.formatDateShort(d.iso), value: getValue(kpi, d.iso), isWeek: false, iso: d.iso }));
  }

  function getMonthlySeries(kpi, days) {
    const buckets = {};
    days.forEach((d) => {
      const month = d.iso.slice(0, 7);
      if (!buckets[month]) buckets[month] = [];
      buckets[month].push(d);
    });
    return Object.keys(buckets)
      .sort()
      .map((month) => {
        const diasMes = buckets[month];
        const valoresDia = diasMes.map((d) => getValue(kpi, d.iso)).filter((v) => v !== null && v !== undefined);
        return {
          key: month,
          label: month.slice(5, 7) + "/" + month.slice(0, 4),
          value: getPeriodValue(kpi, month, diasMes),
          count: valoresDia.length,
        };
      });
  }

  // Resolve um valor a partir de UMA chave de coluna qualquer (dia
  // "2026-08-06" ou semana "W32") — mesma disambiguação de prevPeriodKey
  // (dia tem "-", semana não). Usada por qualquer trecho da tela que lê uma
  // célula da grade genericamente (tabela detalhada, gráfico, comparação
  // com semana de referência) — garante que uma coluna de semana NUNCA
  // caia no getValue cru (que não agrega nada), sempre passa por
  // getWeekValue (agregação + fallback). Corrige o bug confirmado em
  // 2026-08-27: colunas de semana fechada apareciam "—" porque a tabela
  // detalhada lia direto de kpi.valores["Wxx"], que só existe quando a
  // planilha já tem a linha-resumo daquela semana.
  function getValueForKey(kpi, colKey) {
    if (colKey === null || colKey === undefined) return null;
    if (String(colKey).indexOf("-") !== -1) return getValue(kpi, colKey); // dia
    const week = typeof DataService !== "undefined" ? DataService.getWeekByLabel(colKey) : null;
    return getWeekValue(kpi, week);
  }

  function stats(values) {
    const nums = values.filter((v) => v !== null && v !== undefined && isFinite(v));
    if (!nums.length) return { avg: null, min: null, max: null, count: 0 };
    return {
      avg: nums.reduce((a, b) => a + b, 0) / nums.length,
      min: Math.min(...nums),
      max: Math.max(...nums),
      count: nums.length,
    };
  }

  function lastTwoDelta(series) {
    const withData = series.filter((s) => s.value !== null && s.value !== undefined);
    if (withData.length < 2) return null;
    const last = withData[withData.length - 1];
    const prev = withData[withData.length - 2];
    return { current: last, previous: prev, delta: last.value - prev.value };
  }

  window.Calc = {
    getValue,
    getValueForKey,
    addDaysIso,
    prevDayIso,
    prevWeekLabel,
    prevPeriodKey,
    getTodayIso,
    getDefaultWindowDays,
    getDefaultMonths,
    getFilteredDays,
    generateOverviewInsights,
    delta,
    isImprovement,
    getTurnoEntries,
    generateInsights,
    aggregatePeriod,
    getWeekValue,
    getWeeklySeries,
    getDailySeries,
    getMonthlySeries,
    stats,
    lastTwoDelta,
  };
})();

</script>

<!-- Services -->
<script type="text/babel" data-presets="react">
// services/dataService.js — única porta de entrada para os dados.
// Hoje lê de window.KPI_DATA (snapshot real extraído da planilha).
// Amanhã, troque a implementação interna por chamadas a uma API,
// Google Sheets ou Excel — o restante da aplicação não muda.
(function () {
  const RAW = window.KPI_DATA;

  const kpiById = {};
  RAW.kpis.forEach((k) => (kpiById[k.id] = k));

  const dayByIso = {};
  RAW.days.forEach((d) => (dayByIso[d.iso] = d));

  const weekByLabel = {};
  RAW.weeks.forEach((w) => (weekByLabel[w.label] = w));

  function getMeta() {
    return RAW.meta;
  }
  function getWeeks() {
    return RAW.weeks;
  }
  function getDays() {
    return RAW.days;
  }
  function getBlocks() {
    return RAW.blocks;
  }
  function getKPIs() {
    return RAW.kpis;
  }
  function getKPIById(id) {
    return kpiById[id] || null;
  }
  function getDayByIso(iso) {
    return dayByIso[iso] || null;
  }
  function getWeekByLabel(label) {
    return weekByLabel[label] || null;
  }
  function isRealDate(iso) {
    return !!iso && iso <= RAW.meta.lastRealDate;
  }
  function getRefWeeks() {
    return RAW.meta.refWeeks;
  }
  function getDefaultDate() {
    // SoC sem nenhum dado ainda (RJ6/SC1/SC2 recém-abertos no Postgres,
    // pedido do Roberto em 2026-09-22) -> lastRealDate vem null. Selecionar
    // "hoje" como fallback evita propagar null pra selectedIso (usado por
    // ".split"/".slice" em vários componentes que assumem ISO válido —
    // antes disso nunca acontecia, buildArvore() sobre a planilha sempre
    // tinha pelo menos 1 dia com dado real).
    return RAW.meta.lastRealDate || new Date().toISOString().slice(0, 10);
  }
  function getDateBounds() {
    const days = RAW.days;
    // SoC sem nenhum KPI/valor ainda (pedido do Roberto em 2026-09-22, RJ6/
    // SC1/SC2 recém-abertos no Postgres) -> days vem vazio; sem isso o date
    // picker quebrava a tela inteira (days[0] undefined). Usa hoje como
    // min/max degenerado — não há intervalo real, mas a tela continua de pé.
    if (!days.length) {
      const hoje = new Date().toISOString().slice(0, 10);
      return { min: hoje, max: hoje };
    }
    return { min: days[0].iso, max: days[days.length - 1].iso };
  }

  // Meses distintos presentes nos dados (para o filtro de período), em
  // ordem cronológica — inclui todo o histórico, não só a janela padrão.
  function getMonthOptions() {
    const seen = new Set();
    const out = [];
    RAW.days.forEach((d) => {
      const key = d.iso.slice(0, 7);
      if (!seen.has(key)) { seen.add(key); out.push(key); }
    });
    return out.sort();
  }

  // Agrupa preservando a ordem original da planilha (Bloco -> PIC -> Sub Bloco -> KPI)
  function getGroupedKPIs(filterFn) {
    const list = filterFn ? RAW.kpis.filter(filterFn) : RAW.kpis;
    const blocos = [];
    const blocoMap = {};
    list.forEach((kpi) => {
      if (!blocoMap[kpi.bloco]) {
        blocoMap[kpi.bloco] = { bloco: kpi.bloco, pics: [], picMap: {} };
        blocos.push(blocoMap[kpi.bloco]);
      }
      const bEntry = blocoMap[kpi.bloco];
      const picKey = kpi.pic || "—";
      if (!bEntry.picMap[picKey]) {
        bEntry.picMap[picKey] = { pic: picKey, subs: [], subMap: {} };
        bEntry.pics.push(bEntry.picMap[picKey]);
      }
      const pEntry = bEntry.picMap[picKey];
      const subKey = kpi.subBloco || "—";
      if (!pEntry.subMap[subKey]) {
        pEntry.subMap[subKey] = { subBloco: subKey, kpis: [] };
        pEntry.subs.push(pEntry.subMap[subKey]);
      }
      pEntry.subMap[subKey].kpis.push(kpi);
    });
    return blocos;
  }

  // "days" é o período filtrado (Data/Semana/Mês na Visão Geral — ou só o
  // dia selecionado, vindo de outras telas). Duas coisas MUITO diferentes
  // são calculadas aqui:
  //  - Performance por Bloco = preenchimento dos dados no período inteiro
  //    (quantas células KPI×dia têm valor, independente de estar dentro
  //    ou fora do Target).
  //  - Status (tiles Dentro/Atenção/Fora + principais desvios) = uma foto
  //    do dia mais recente do período (status é um conceito pontual, não
  //    "acumulado"; não faz sentido somar "dentro do target" ao longo de
  //    vários dias).
  function computeOverviewStats(days) {
    const dayList = (Array.isArray(days) ? days : [days]).filter(Boolean);
    const kpis = RAW.kpis;

    const sortedIsos = dayList.map((d) => (typeof d === "string" ? d : d.iso)).sort();
    const refIso = sortedIsos.length ? sortedIsos[sortedIsos.length - 1] : RAW.meta.lastRealDate;

    let ok = 0, warn = 0, bad = 0, na = 0;
    const deviations = [];
    kpis.forEach((kpi) => {
      const value = Calc.getValue(kpi, refIso);
      const prevValue = Calc.getValue(kpi, Calc.prevDayIso(refIso));
      const statusLabel = StatusUtil.computeStatusLabel(kpi, value, prevValue, refIso);
      const inTarget = statusLabel.key === "in_target" || statusLabel.key === "in_target_stable";
      const warnish = statusLabel.key === "in_target_worsening" || statusLabel.key === "out_target_improving";
      const outBad = statusLabel.key === "out_target_worsening";

      if (inTarget) ok++;
      else if (warnish) warn++;
      else if (outBad) bad++;
      else na++;

      if ((warnish || outBad) && kpi.target !== null && value !== null) {
        const denom = Math.max(Math.abs(kpi.target), kpi.unit === "percent" ? 0.01 : 1);
        const score = Math.abs(value - kpi.target) / denom;
        deviations.push({ kpi, value, statusLabel, score });
      }
    });
    deviations.sort((a, b) => b.score - a.score);

    // preenchimento por bloco, no período inteiro
    const byBloco = {};
    kpis.forEach((kpi) => {
      if (!byBloco[kpi.bloco]) byBloco[kpi.bloco] = { bloco: kpi.bloco, filled: 0, total: 0 };
      const e = byBloco[kpi.bloco];
      sortedIsos.forEach((iso) => {
        e.total++;
        if (Calc.getValue(kpi, iso) !== null) e.filled++;
      });
    });
    const blocoPerf = RAW.blocks
      .filter((b) => byBloco[b])
      .map((b) => {
        const e = byBloco[b];
        return { bloco: b, pct: e.total > 0 ? Math.round((e.filled / e.total) * 100) : null, filled: e.filled, total: e.total };
      });

    return {
      total: kpis.length,
      ok,
      warn,
      bad,

})();

// components/DatePicker.js — seletor de data (dropdown com calendário) e
// navegação rápida (dia anterior / próximo dia).
(function () {
  const { useState, useRef, useEffect, useMemo } = React;

  const MONTH_NAMES = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
  const WD_SHORT = ["D", "S", "T", "Q", "Q", "S", "S"];

  function isoOf(y, m, d) {
    return y + "-" + String(m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
  }

  function buildMonthGrid(year, month) {
    const first = new Date(Date.UTC(year, month, 1));
    const startDow = first.getUTCDay();
    const daysInMonth = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
    const cells = [];
    for (let i = 0; i < startDow; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push(d);
    return cells;
  }

  function DatePicker({ selectedIso, onChange }) {
    const [open, setOpen] = useState(false);
    const bounds = useMemo(() => DataService.getDateBounds(), []);
    const sel = selectedIso.split("-").map(Number);
    const [viewYear, setViewYear] = useState(sel[0]);
    const [viewMonth, setViewMonth] = useState(sel[1] - 1);
    const ref = useRef(null);

    useEffect(() => {
      const s = selectedIso.split("-").map(Number);
      setViewYear(s[0]);
      setViewMonth(s[1] - 1);
    }, [open]);

    useEffect(() => {
      function onDocClick(e) {
        if (ref.current && !ref.current.contains(e.target)) setOpen(false);
      }
      function onEsc(e) {
        if (e.key === "Escape") setOpen(false);
      }
      document.addEventListener("mousedown", onDocClick);
      document.addEventListener("keydown", onEsc);
      return () => {
        document.removeEventListener("mousedown", onDocClick);
        document.removeEventListener("keydown", onEsc);
      };
    }, []);

    const cells = buildMonthGrid(viewYear, viewMonth);
    const lastReal = DataService.getMeta().lastRealDate;

    function shiftMonth(delta) {
      let m = viewMonth + delta;
      let y = viewYear;
      if (m < 0) { m = 11; y--; }
      if (m > 11) { m = 0; y++; }
      setViewMonth(m);
      setViewYear(y);

          type="button"
          onClick={() => setOpen((o) => !o)}

                <Icons.ChevronLeft size={16} />
              </button>
              <div className="text-sm font-semibold">{MONTH_NAMES[viewMonth]} {viewYear}</div>
              <button className="p-1 rounded hover:bg-neutral-100" onClick={() => shiftMonth(1)}>
                <Icons.ChevronRight size={16} />
              </button>
            </div>
            <div className="grid grid-cols-7 gap-1 text-center text-[11px] text-neutral-400 mb-1">
              {WD_SHORT.map((w, i) => <div key={i}>{w}</div>)}
            </div>
            <div className="grid grid-cols-7 gap-1">
              {cells.map((d, i) => {
                if (d === null) return <div key={i} />;
                const iso = isoOf(viewYear, viewMonth, d);
                const inBounds = iso >= bounds.min && iso <= bounds.max;
                const isSelected = iso === selectedIso;
                const isFuture = iso > lastReal;
                const isToday = false;
                return (
                  <button
                    key={i}
                    disabled={!inBounds}
                    onClick={() => { onChange(iso); setOpen(false); }}

                      "h-7 w-7 rounded-md text-xs flex items-center justify-center transition-colors",
                      !inBounds ? "text-neutral-300 cursor-not-allowed" : "hover:bg-brand-tint cursor-pointer",
                      isSelected ? "bg-brand text-white font-semibold hover:bg-brand" : "",
                      !isSelected && isFuture && inBounds ? "text-neutral-400 italic" : "",
                    ].join(" ")}
                    title={isFuture && inBounds ? "Sem dado ainda (data futura em relação ao último fechamento)" : ""}
                  >
                    {d}
                  </button>
                );
              })}
            </div>
            <div className="mt-2 pt-2 border-t border-neutral-100 flex items-center justify-between text-[11px] text-neutral-500">
              <span className="italic">Itálico = ainda sem dado</span>
              <button className="text-brand font-medium hover:underline" onClick={() => { onChange(lastReal); setOpen(false); }}>
                Ir para o mais recente
              </button>
            </div>
          </div>
        )}
      </div>
    );
  }

  function DateNav({ selectedIso, onChange }) {
    const bounds = DataService.getDateBounds();
    const prevIso = Calc.prevDayIso(selectedIso);
    const nextIso = Calc.addDaysIso(selectedIso, 1);
    const hasData = DataService.isRealDate(selectedIso);

    return (
      <div className="flex items-center gap-2">
        <button
          disabled={prevIso < bounds.min}
          onClick={() => onChange(prevIso)}
          className="flex items-center gap-1 rounded-md border border-neutral-200 bg-white px-2.5 py-1.5 text-xs font-medium text-neutral-600 hover:bg-neutral-50 disabled:opacity-40 disabled:cursor-not-allowed"
        >
          <Icons.ChevronLeft size={14} /> Dia anterior
        </button>
        <div className={"flex items-center gap-1.5 rounded-md px-3 py-1.5 text-xs font-semibold " + (hasData ? "bg-neutral-100 text-neutral-700" : "bg-warn-bg text-warn-text")}>
          <Icons.Calendar size={13} />
          {Fmt.formatDateFull(selectedIso)}
          {!hasData && <span className="font-normal">· sem dado</span>}
        </div>
        <button
          disabled={nextIso > bounds.max}
          onClick={() => onChange(nextIso)}
          className="flex items-center gap-1 rounded-md border border-neutral-200 bg-white px-2.5 py-1.5 text-xs font-medium text-neutral-600 hover:bg-neutral-50 disabled:opacity-40 disabled:cursor-not-allowed"
        >
          Próximo dia <Icons.ChevronRight size={14} />
        </button>
      </div>
    );
  }

  window.Components = window.Components || {};
  window.Components.DatePicker = DatePicker;
  window.Components.DateNav = DateNav;
})();

</script>

<script type="text/babel" data-presets="react">
// components/MultiSelect.js — dropdown de seleção múltipla (checkboxes),
// usado pelos filtros de Mês e Semana. "isDefault" mostra um rótulo
// diferenciado quando a seleção ainda é o padrão automático (não tocado
// pelo usuário) em vez de uma lista explícita.
(function () {
  const { useState, useRef, useEffect } = React;

  function MultiSelect({ label, options, selected, onChange, onSelectAll, onReset, isDefault }) {
    const [open, setOpen] = useState(false);
    const ref = useRef(null);

    useEffect(() => {
      function onDocClick(e) {
        if (ref.current && !ref.current.contains(e.target)) setOpen(false);
      }
      function onEsc(e) {
        if (e.key === "Escape") setOpen(false);
      }
      document.addEventListener("mousedown", onDocClick);
      document.addEventListener("keydown", onEsc);
      return () => {
        document.removeEventListener("mousedown", onDocClick);
        document.removeEventListener("keydown", onEsc);
      };
    }, []);

    function toggle(value) {
      if (selected.includes(value)) onChange(selected.filter((v) => v !== value));
      else onChange([...selected, value]);
    }

    const summary =
      selected.length === 0 || (options.length > 0 && selected.length === options.length)
        ? "todos"
        : selected.length + " sel.";

    return (
      <div className="relative" ref={ref}>
        <button
          type="button"
          onClick={() => setOpen((o) => !o)}
          className={
            "flex items-center gap-1.5 rounded-md border px-2.5 py-1.5 text-xs font-medium transition-colors " +

          }

            <div className="flex items-center justify-between px-2.5 py-1.5 border-b border-neutral-100 text-[11px]">
              <button onClick={onSelectAll} className="text-brand font-medium hover:underline">Selecionar todos</button>

            </div>
            <div className="max-h-64 overflow-y-auto py-1">
              {options.map((o) => (
                <label key={o.value} className="flex items-center gap-2 px-2.5 py-1.5 hover:bg-neutral-50 cursor-pointer text-xs text-neutral-700">
                  <input type="checkbox" checked={selected.includes(o.value)} onChange={() => toggle(o.value)} className="accent-brand" />

})();

<script type="text/babel" data-presets="react">
// components/KPIChart.js — gráfico de evolução (Chart.js), gerado
// dinamicamente a partir dos dados: 2 semanas de referência + janela de
// dias terminando na data selecionada, com tooltip e destaque do dia ativo.
(function () {
  const { useRef, useEffect, useMemo } = React;

  if (window.ChartDataLabels) Chart.register(window.ChartDataLabels);

  const STATUS_HEX = { ok: "#1E8E3E", warn: "#B15C00", bad: "#D93025", na: "#9AA0A6" };

  // Evita rótulos colados na linha: pico -> acima, vale -> abaixo,
  // trecho em subida/descida -> alterna pra não empilhar em cima do traço.
  function labelAlign(values, i) {
    const cur = values[i];
    if (cur === null || cur === undefined) return "top";
    const prev = i > 0 ? values[i - 1] : null;
    const next = i < values.length - 1 ? values[i + 1] : null;
    const higherThanPrev = prev === null || prev === undefined || cur >= prev;
    const higherThanNext = next === null || next === undefined || cur >= next;
    if (higherThanPrev && higherThanNext) return "top";
    if (!higherThanPrev && !higherThanNext) return "bottom";
    return i % 2 === 0 ? "top" : "bottom";
  }

  function buildSeries(kpi, selectedIso) {
    const refWeeks = DataService.getRefWeeks().map((label) => DataService.getWeekByLabel(label)).filter(Boolean);
    const weekPoints = Calc.getWeeklySeries(kpi, refWeeks);

    const days = DataService.getDays();
    const idx = days.findIndex((d) => d.iso === selectedIso);
    const centerIdx = idx === -1 ? days.length - 1 : idx;
    const WINDOW = 13;
    const start = Math.max(0, centerIdx - WINDOW);
    const dayWindow = days.slice(start, centerIdx + 1);
    const dayPoints = Calc.getDailySeries(kpi, dayWindow);

    return weekPoints.concat(dayPoints);
  }

  function KPIChart({ kpi, selectedIso, height = 210 }) {
    const canvasRef = useRef(null);
    const chartRef = useRef(null);
    const series = useMemo(() => buildSeries(kpi, selectedIso), [kpi.id, selectedIso]);

    useEffect(() => {
      if (!canvasRef.current) return;
      const ctx = canvasRef.current.getContext("2d");

      const labels = series.map((p) => p.label);
      const values = series.map((p) => (p.value === null ? null : (kpi.unit === "percent" ? p.value * 100 : p.value)));
      const pointColors = series.map((p) => {
        const compareValue = Calc.getValueForKey(kpi, Calc.prevPeriodKey(p.key));
        const st = StatusUtil.computeStatusLabel(kpi, p.value, compareValue, p.key);
        return STATUS_HEX[st.color];
      });
      const pointRadii = series.map((p) => (p.key === selectedIso ? 6 : p.isWeek ? 4 : 3));
      const pointBorder = series.map((p) => (p.key === selectedIso ? "#242424" : "#fff"));

      const targetLine = kpi.target !== null && kpi.target !== undefined
        ? values.map(() => (kpi.unit === "percent" ? kpi.target * 100 : kpi.target))
        : null;

      if (chartRef.current) chartRef.current.destroy();
      chartRef.current = new Chart(ctx, {
        type: "line",
        data: {
          labels,
          datasets: [
            targetLine && {
              label: "Target",
              data: targetLine,
              borderColor: "#C8401F",
              borderDash: [5, 4],
              borderWidth: 1.4,
              pointRadius: 0,
              fill: false,
              tension: 0,
            },
            {
              label: kpi.kpi,
              data: values,
              borderColor: "#EE4D2D",
              backgroundColor: "rgba(238,77,45,.08)",
              borderWidth: 2,
              pointBackgroundColor: pointColors,
              pointBorderColor: pointBorder,
              pointBorderWidth: 1.5,
              pointRadius: pointRadii,
              pointHoverRadius: 7,
              fill: true,
              tension: 0.25,
              spanGaps: true,
            },
          ].filter(Boolean),
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          interaction: { mode: "index", intersect: false },
          layout: { padding: { top: 16, bottom: 4 } },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: "#242424",
              padding: 8,
              titleFont: { size: 11, weight: "600" },
              bodyFont: { size: 11.5 },
              callbacks: {
                label: (item) => {
                  if (item.raw === null || item.raw === undefined) return "Sem dado";
                  const suffix = kpi.unit === "percent" ? "%" : "";
                  const label = item.dataset.label === "Target" ? "Target: " : "Resultado: ";
                  return label + item.raw.toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + suffix;
                },
              },
            },
            datalabels: {
              display: (context) => context.dataset.label !== "Target" && context.dataset.data[context.dataIndex] !== null,
              align: (context) => labelAlign(values, context.dataIndex),
              anchor: "center",
              offset: 7,
              clamp: true,
              color: "#3a3a3a",
              font: { size: 9.5, weight: "600" },
              backgroundColor: "rgba(255,255,255,.88)",
              borderRadius: 3,
              padding: { top: 1, bottom: 1, left: 3, right: 3 },
              formatter: (v, context) => {
                const raw = series[context.dataIndex] ? series[context.dataIndex].value : null;
                return raw === null || raw === undefined ? "" : Fmt.formatKpiValue(kpi, raw);
              },
            },
          },
          scales: {
            x: {
              grid: { display: false },
              ticks: { font: { size: 10.5 }, color: "#8a8a8a", maxRotation: 0, autoSkip: true, maxTicksLimit: 10 },
            },
            y: {
              grid: { color: "#F0F0F0" },
              ticks: {
                font: { size: 10.5 },
                color: "#8a8a8a",
                callback: (v) => v + (kpi.unit === "percent" ? "%" : ""),
              },
            },
          },
        },
      });

      return () => {
        if (chartRef.current) {
          chartRef.current.destroy();
          chartRef.current = null;
        }
      };
    }, [series, kpi.id]);

    return (
      <div style={{ height }}>
        <canvas ref={canvasRef}></canvas>
      </div>
    );
  }

  // Limite de densidade pra decidir se vale mostrar rótulos permanentes
  // num gráfico (linha × série) — acima disso, os números se sobrepõem e
  // viram poluição visual em vez de informação; some com tooltip apenas.
  function labelsFitDensity(pointCount, seriesCount) {
    return pointCount * (seriesCount || 1) <= 60;
  }

  window.Components = window.Components || {};
  window.Components.KPIChart = KPIChart;
  window.ChartHelpers = { buildSeries, labelAlign, labelsFitDensity };
})();

</script>
